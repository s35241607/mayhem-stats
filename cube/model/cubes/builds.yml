cubes:
  # 出裝定位：依這場終場的裝備判斷「實際怎麼玩」，不看英雄的官方定位。全站只用這一套六類（2026-10-11 收斂）：
  #   坦克、鬥士、刺客、射手、法師、輔助（太早結束沒成裝的，依不看裝備的數字推斷，見 SQL 裡的 nb_* 常數）。
  # 傷害類型（AD／AP）另外一個欄位 damage_type，不放進定位名稱——以前的「AD 鬥士／AP 鬥士、AD 輸出／AP 輸出」
  # 讓定位變成九種，雷達、陣容、好友比較每頁各自再合併一次，越來越難懂。
  #
  # 為什麼需要：官方定位看不出實際出裝。官方「鬥士」有一半出純輸出裝、「輔助」常出法師裝——
  # 用官方定位問「適不適合鬥士」，其實混了兩種完全不同的玩法。
  #
  # 怎麼算：終場 6 格裝備（不含飾品），排除鞋子與總價 1500 以下的零件，把每件的「總價」分給
  # AD／AP／坦度三堆，輔助裝另成一堆。混合裝依能力值的金錢價值拆（dim_item_stats，見 SQL 的 stat_gold）：
  #   黎安卓的折磨（60 魔攻＋300 生命）AP 60%、坦度 40%；烏莉特的法帽 AP 86%、坦度 14%；黑色切割者 AD 60%、坦度 40%。
  #   沒有能力值資料的裝備才退回「屬於幾堆就平分」。2026-10-25 以前全部都是平分：法師出黎安卓、中婭就被算成一半坦裝，
  #   官方主定位是法師的人有 20% 被判成鬥士（改後 12%，剩下的多半是斯溫、賽勒斯、雷茲疊瑞萊、時光之杖、峽谷製造者這種戰鬥法師）。
  # 再看各堆佔的金額比例，依序：
  #   1. 輔助裝 ≥ 35%                                        → 輔助
  #   2. 坦度 ≥ 50%，且 AD、AP 都 < 25%（幾乎純坦裝）          → 坦克
  #   3. 坦度 ≥ 30%（一半肉一半輸出）                         → 鬥士
  #   4. AD ≥ AP：AD 金額裡「穿甲裝」最多                      → 刺客
  #              否則英雄有官方「射手」定位                     → 射手
  #              否則英雄的官方主定位是刺客（卡特蓮娜、雷葛爾）  → 刺客
  #              否則（鬥士英雄出 AD 輸出裝：剛普朗克、趙信、犽宿…）→ 鬥士
  #   5. AP > AD：英雄的官方主定位是刺客                       → 刺客，否則 → 法師
  #   沒有任何成裝（太早結束）                                 → 不看裝備，用數字推斷（nb_*）
  #
  # 鬥士英雄出全輸出裝（2026-10-11 從刺客改到鬥士）：剛普朗克、特朗德、伊瑞莉雅、雷尼克頓、趙信、犽宿、易大師…
  #   官方主定位都是鬥士，玩法是近戰打架，不是進場秒人；放在刺客裡和劫、塔隆一起比很怪（使用者指出）。
  #   官方主定位＝同一隻英雄 rowid 最小的那筆，客戶端第一個列的定位（伊瑞莉雅是 fighter,assassin → 鬥士）。
  #
  # 刺客＝要貼身切入秒人的輸出：
  #   穿甲型 AD（劫、塔隆、派克）：類別 ArmorPenetration 同時貼在妖夢、傲慢（物理致命）與蒐集者、多明尼克（暴擊）上，
  #     所以 AD 的金額再依裝備數值（dim_item_stats）細分：有暴擊率 → 暴擊；否則有物理致命或物理穿透 → 穿甲；
  #     否則有攻速 → 攻速；其餘 → 其他。穿甲那一堆嚴格最多才算（同額不算：平手的是克黎思妲、希維爾這種射手）。
  #   官方主定位是刺客的英雄出 AD 輸出裝（卡特蓮娜、雷葛爾、娜菲芮）。
  #   射手的判斷：客戶端資料沒有攻擊距離，用官方定位——英雄任何一個官方定位是 marksman 就算射手
  #     （杰西、凱爾的射手是第二定位），近戰英雄都沒有這個定位。
  #   AP 刺客（艾克、飛斯、勒布朗、阿卡莉）：裝備和法師分不開（唯一線索魔法穿透，但黯影之炎幾乎每個法師都買），
  #     只好借英雄的官方主定位（同 champion_roles.is_primary：同一隻英雄 rowid 最小的那筆）。
  #
  # 類別來自客戶端 items.json（dim_item_categories）。
  #   AD  ：Damage、CriticalStrike、AttackSpeed、ArmorPenetration、LifeSteal、OnHit
  #   AP  ：SpellDamage、MagicPenetration、SpellVamp
  #   坦度：Health、Armor、SpellBlock、MagicResist
  # 輔助裝沒有可用的類別（「法力回復」同時出現在時光之杖、奪魄之鐮；「光環」多半是坦克裝），
  # 只能明列：月之石再生裝置、帝王命令、歌謠之冠、熾灼魔器、破曉之核、贖罪神石、流水之杖、
  # 米凱的祝福、希利亞的迴響、蘇瑞亞的戰歌、低語之環。騎士誓願、日輪的加冕本質是坦克裝，照金額算進坦度。
  #
  # 傷害類型 damage_type：AD 金額 ≥ AP 金額是 AD，否則 AP；兩堆都是 0（純坦、純輔助裝）是「無」。
  - name: builds
    title: 出裝定位
    # 規則本體在 meta.materialize.sql。每次入庫後由 features.py 照它重建 mat_builds，這裡直接讀表：
    # 對全部參賽者跑視窗函數的成本每個查詢都要付一次，資料十倍時一個查詢要十幾秒（實測）。
    # 改規則只改這裡；改完重啟服務或跑 `uv run features.py` 才會重建。
    sql_table: mat_builds
    meta:
      materialize:
        table: mat_builds
        sql: >
          WITH stat_gold AS (
            -- 一件裝備的能力值換成金錢價值（召喚峽谷基本零件的單價：長劍 35／攻擊力、增幅典籍 20／魔法攻擊、布甲 20／護甲、
            -- 抗魔斗篷 18／魔法抗性、紅水晶 2.67／生命、短劍 25／1% 攻速、敏捷斗篷 40／1% 暴擊…），用來把混合裝的總價依能力值拆給 AD／AP／坦度
            SELECT item_id,
              SUM(CASE stat WHEN 'AttackDamage' THEN value * 35 WHEN 'AttackSpeed' THEN value * 25 WHEN 'CritChance' THEN value * 40
                            WHEN 'Lethality' THEN value * 30 WHEN 'ArmorPenetration' THEN value * 41.67 WHEN 'LifeSteal' THEN value * 55 ELSE 0 END) AS g_ad,
              SUM(CASE stat WHEN 'AbilityPower' THEN value * 20 WHEN 'MagicPenetration' THEN value * 31 WHEN 'MagicPenetrationPercent' THEN value * 46 ELSE 0 END) AS g_ap,
              SUM(CASE stat WHEN 'Armor' THEN value * 20 WHEN 'MagicResist' THEN value * 18 WHEN 'Health' THEN value * 2.67 ELSE 0 END) AS g_tank
            FROM dim_item_stats GROUP BY item_id
          ),
          item_groups AS (
            SELECT di.id AS item_id, di.price_total AS price,
              MAX(c.category IN ('Damage','CriticalStrike','AttackSpeed','ArmorPenetration','LifeSteal','OnHit')) AS is_ad,
              MAX(c.category IN ('SpellDamage','MagicPenetration','SpellVamp')) AS is_ap,
              MAX(c.category IN ('Health','Armor','SpellBlock','MagicResist')) AS is_tank,
              MAX(sg.g_ad) AS g_ad, MAX(sg.g_ap) AS g_ap, MAX(sg.g_tank) AS g_tank,
              MAX(c.category = 'Boots') AS is_boots,
              di.id IN (6617, 4005, 2530, 3504, 6621, 3107, 6616, 3222, 6620, 2065, 2526) AS is_sup,
              -- AD 的細分，依序判斷：暴擊 → 穿甲 → 攻速 → 其他
              CASE
                WHEN EXISTS (SELECT 1 FROM dim_item_stats s WHERE s.item_id = di.id AND s.stat = 'CritChance') THEN 'crit'
                WHEN EXISTS (SELECT 1 FROM dim_item_stats s WHERE s.item_id = di.id AND s.stat IN ('Lethality', 'ArmorPenetration')) THEN 'pen'
                WHEN EXISTS (SELECT 1 FROM dim_item_stats s WHERE s.item_id = di.id AND s.stat = 'AttackSpeed') THEN 'as'
                ELSE 'other'
              END AS ad_kind
            FROM dim_items di JOIN dim_item_categories c ON c.item_id = di.id
            LEFT JOIN stat_gold sg ON sg.item_id = di.id
            GROUP BY di.id
          ),
          primary_role AS (
            SELECT champion_id, role FROM dim_champion_roles r
            WHERE r.rowid = (SELECT MIN(r2.rowid) FROM dim_champion_roles r2 WHERE r2.champion_id = r.champion_id)
          ),
          marksman AS (
            SELECT DISTINCT champion_id FROM dim_champion_roles WHERE role = 'marksman'
          ),
          per_item AS (
            -- 每件裝備分給三堆的比例 w_*（加起來 1）：有可辨識的能力值就依能力值的金錢價值拆，
            -- 例如黎安卓的折磨（60 魔攻＋300 生命）是 AP 60%、坦度 40%，烏莉特的法帽（300 魔攻＋50 護甲）AP 86%、坦度 14%；
            -- 沒有能力值資料的才退回「屬於幾堆就平分」（2026-10-25 以前全部都是平分，法師出黎安卓、中婭就被算成一半坦裝）
            SELECT pi.platform_id, pi.game_id, pi.participant_id, g.price, g.is_sup, g.ad_kind,
                   CASE WHEN COALESCE(g.g_ad + g.g_ap + g.g_tank, 0) > 0 THEN g.g_ad / (g.g_ad + g.g_ap + g.g_tank)
                        WHEN g.is_ad + g.is_ap + g.is_tank > 0 THEN g.is_ad * 1.0 / (g.is_ad + g.is_ap + g.is_tank) ELSE 0 END AS w_ad,
                   CASE WHEN COALESCE(g.g_ad + g.g_ap + g.g_tank, 0) > 0 THEN g.g_ap / (g.g_ad + g.g_ap + g.g_tank)
                        WHEN g.is_ad + g.is_ap + g.is_tank > 0 THEN g.is_ap * 1.0 / (g.is_ad + g.is_ap + g.is_tank) ELSE 0 END AS w_ap,
                   CASE WHEN COALESCE(g.g_ad + g.g_ap + g.g_tank, 0) > 0 THEN g.g_tank / (g.g_ad + g.g_ap + g.g_tank)
                        WHEN g.is_ad + g.is_ap + g.is_tank > 0 THEN g.is_tank * 1.0 / (g.is_ad + g.is_ap + g.is_tank) ELSE 0 END AS w_tank
            FROM participant_items pi JOIN item_groups g ON g.item_id = pi.item_id
            WHERE pi.slot < 6 AND g.price >= 1500 AND g.is_boots = 0
          ),
          gold AS (
            SELECT platform_id, game_id, participant_id,
              SUM(CASE WHEN is_sup = 0 THEN price * w_ad ELSE 0 END) AS ad,
              SUM(CASE WHEN is_sup = 0 THEN price * w_ap ELSE 0 END) AS ap,
              SUM(CASE WHEN is_sup = 0 THEN price * w_tank ELSE 0 END) AS tank,
              SUM(CASE WHEN is_sup = 1 THEN price ELSE 0 END) AS sup,
              SUM(CASE WHEN is_sup = 0 AND ad_kind = 'crit' THEN price * w_ad ELSE 0 END) AS ad_crit,
              SUM(CASE WHEN is_sup = 0 AND ad_kind = 'pen' THEN price * w_ad ELSE 0 END) AS ad_pen,
              SUM(CASE WHEN is_sup = 0 AND ad_kind = 'as' THEN price * w_ad ELSE 0 END) AS ad_as,
              SUM(CASE WHEN is_sup = 0 AND ad_kind = 'other' THEN price * w_ad ELSE 0 END) AS ad_other
            FROM per_item GROUP BY 1, 2, 3
          ),
          team_taken AS (
            SELECT platform_id, game_id, team_id, SUM(dmg_taken) AS taken
            FROM match_participants GROUP BY 1, 2, 3
          ),
            -- 沒有任何成裝的人（太早結束、裝備資料缺）：不看裝備，用數字推斷定位（高斯單純貝氏，v3.3 定版）。
            -- 8 個連續特徵各有每個定位的平均與標準差（nb_c），6 個官方定位旗標用機率（nb_f），再加定位先驗（nb_p）。
            -- 常數是在 9,278 場有定位的計分場次上算出來寫死的，留出驗證準確率 78.6%；新增對局不會改常數。
            -- 特徵都不看裝備：傷害型態、占全隊的對英雄傷害與承傷、每分鐘補兵／控場／治療／死亡、參團率、英雄的官方定位。
          nb_p(role, lp) AS (VALUES
              ('坦克', -1.8826),
              ('鬥士', -1.5360),
              ('刺客', -2.1498),
              ('射手', -1.7124),
              ('法師', -1.1952),
              ('輔助', -3.4118)
          ),
          nb_c(role, f, mu, sd) AS (VALUES
              ('坦克', 0, 0.4250, 0.2232), ('坦克', 1, 0.1629, 0.0607), ('坦克', 2, 0.3642, 0.0943), ('坦克', 3, 1.2384, 0.8934),
              ('坦克', 4, 2.9823, 1.5701), ('坦克', 5, 6.3131, 1.0209), ('坦克', 6, 0.7037, 0.1121), ('坦克', 7, 0.6092, 0.1594),
              ('鬥士', 0, 0.5798, 0.3187), ('鬥士', 1, 0.2080, 0.0654), ('鬥士', 2, 0.2465, 0.0850), ('鬥士', 3, 2.3524, 1.1771),
              ('鬥士', 4, 1.7739, 1.3811), ('鬥士', 5, 6.2512, 0.9347), ('鬥士', 6, 0.6676, 0.1148), ('鬥士', 7, 0.6769, 0.1730),
              ('刺客', 0, 0.5472, 0.3699), ('刺客', 1, 0.2156, 0.0627), ('刺客', 2, 0.1797, 0.0626), ('刺客', 3, 1.8826, 1.0098),
              ('刺客', 4, 1.1936, 1.2759), ('刺客', 5, 5.6847, 0.9135), ('刺客', 6, 0.6631, 0.1074), ('刺客', 7, 0.6800, 0.1776),
              ('射手', 0, 0.7958, 0.1641), ('射手', 1, 0.2244, 0.0678), ('射手', 2, 0.1310, 0.0449), ('射手', 3, 3.3540, 1.2936),
              ('射手', 4, 0.8736, 0.8468), ('射手', 5, 5.5147, 0.9186), ('射手', 6, 0.6827, 0.1143), ('射手', 7, 0.6260, 0.1535),
              ('法師', 0, 0.0684, 0.1025), ('法師', 1, 0.2058, 0.0637), ('法師', 2, 0.1415, 0.0574), ('法師', 3, 2.3490, 1.0830),
              ('法師', 4, 2.2446, 1.3937), ('法師', 5, 5.2373, 1.1010), ('法師', 6, 0.6935, 0.1124), ('法師', 7, 0.5915, 0.1823),
              ('輔助', 0, 0.1408, 0.1402), ('輔助', 1, 0.0788, 0.0361), ('輔助', 2, 0.1254, 0.0503), ('輔助', 3, 0.6005, 0.4480),
              ('輔助', 4, 2.2941, 1.2361), ('輔助', 5, 6.7293, 1.0181), ('輔助', 6, 0.8301, 0.0908), ('輔助', 7, 0.4151, 0.1530)
          ),
          nb_f(role, f, p) AS (VALUES
              ('坦克', 8, 0.9059), ('坦克', 9, 0.3522), ('坦克', 10, 0.0354), ('坦克', 11, 0.0007), ('坦克', 12, 0.1492), ('坦克', 13, 0.4208),
              ('鬥士', 8, 0.3597), ('鬥士', 9, 0.7799), ('鬥士', 10, 0.3512), ('鬥士', 11, 0.0200), ('鬥士', 12, 0.2211), ('鬥士', 13, 0.0875),
              ('刺客', 8, 0.0499), ('刺客', 9, 0.3324), ('刺客', 10, 0.8652), ('刺客', 11, 0.0840), ('刺客', 12, 0.3426), ('刺客', 13, 0.0508),
              ('射手', 8, 0.0006), ('射手', 9, 0.0227), ('射手', 10, 0.2291), ('射手', 11, 0.9994), ('射手', 12, 0.3037), ('射手', 13, 0.1008),
              ('法師', 8, 0.1057), ('法師', 9, 0.1338), ('法師', 10, 0.0843), ('法師', 11, 0.1655), ('法師', 12, 0.8801), ('法師', 13, 0.3630),
              ('輔助', 8, 0.0227), ('輔助', 9, 0.0195), ('輔助', 10, 0.0097), ('輔助', 11, 0.0325), ('輔助', 12, 0.9448), ('輔助', 13, 0.9740)
          ),
          nb_feat AS (
            SELECT mp.rowid AS participant_rowid,
              COALESCE(mp.dmg_physical * 1.0 / NULLIF(mp.dmg_physical + mp.dmg_magic + mp.dmg_true, 0), 0.5) AS x0,
              COALESCE(mp.dmg_to_champions * 1.0 / NULLIF(mp.team_dmg, 0), 0) AS x1,
              COALESCE((mp.dmg_taken + mp.dmg_mitigated) * 1.0 / NULLIF(SUM(mp.dmg_taken + mp.dmg_mitigated) OVER tm, 0), 0) AS x2,
              mp.cs * 60.0 / m.game_duration AS x3,
              mp.time_ccing_others * 60.0 / m.game_duration AS x4,
              LN(1 + mp.total_heal * 60.0 / m.game_duration) AS x5,
              COALESCE((mp.kills + mp.assists) * 1.0 / NULLIF(SUM(mp.kills) OVER tm, 0), 0) AS x6,
              mp.deaths * 60.0 / m.game_duration AS x7,
              EXISTS (SELECT 1 FROM dim_champion_roles r WHERE r.champion_id = mp.champion_id AND r.role = 'tank') AS x8,
              EXISTS (SELECT 1 FROM dim_champion_roles r WHERE r.champion_id = mp.champion_id AND r.role = 'fighter') AS x9,
              EXISTS (SELECT 1 FROM dim_champion_roles r WHERE r.champion_id = mp.champion_id AND r.role = 'assassin') AS x10,
              EXISTS (SELECT 1 FROM dim_champion_roles r WHERE r.champion_id = mp.champion_id AND r.role = 'marksman') AS x11,
              EXISTS (SELECT 1 FROM dim_champion_roles r WHERE r.champion_id = mp.champion_id AND r.role = 'mage') AS x12,
              EXISTS (SELECT 1 FROM dim_champion_roles r WHERE r.champion_id = mp.champion_id AND r.role = 'support') AS x13
            FROM match_participants mp
            JOIN matches m ON m.platform_id = mp.platform_id AND m.game_id = mp.game_id
            WINDOW tm AS (PARTITION BY mp.platform_id, mp.game_id, mp.team_id)
          ),
          nb_cont AS (
            SELECT x.participant_rowid, c.role, SUM(-0.5 * ((x.v - c.mu) / c.sd) * ((x.v - c.mu) / c.sd) - LN(c.sd)) AS ll
            FROM (SELECT participant_rowid, 0 AS f, x0 AS v FROM nb_feat UNION ALL SELECT participant_rowid, 1, x1 FROM nb_feat
                  UNION ALL SELECT participant_rowid, 2, x2 FROM nb_feat UNION ALL SELECT participant_rowid, 3, x3 FROM nb_feat
                  UNION ALL SELECT participant_rowid, 4, x4 FROM nb_feat UNION ALL SELECT participant_rowid, 5, x5 FROM nb_feat
                  UNION ALL SELECT participant_rowid, 6, x6 FROM nb_feat UNION ALL SELECT participant_rowid, 7, x7 FROM nb_feat) x
            JOIN nb_c c ON c.f = x.f
            GROUP BY x.participant_rowid, c.role
          ),
          nb_flag AS (
            SELECT x.participant_rowid, c.role, SUM(CASE WHEN x.v = 1 THEN LN(c.p) ELSE LN(1 - c.p) END) AS ll
            FROM (SELECT participant_rowid, 8 AS f, x8 AS v FROM nb_feat UNION ALL SELECT participant_rowid, 9, x9 FROM nb_feat
                  UNION ALL SELECT participant_rowid, 10, x10 FROM nb_feat UNION ALL SELECT participant_rowid, 11, x11 FROM nb_feat
                  UNION ALL SELECT participant_rowid, 12, x12 FROM nb_feat UNION ALL SELECT participant_rowid, 13, x13 FROM nb_feat) x
            JOIN nb_f c ON c.f = x.f
            GROUP BY x.participant_rowid, c.role
          ),
          nb_role AS (
            SELECT participant_rowid, role FROM (
              SELECT t.participant_rowid, t.role,
                ROW_NUMBER() OVER (PARTITION BY t.participant_rowid ORDER BY t.ll + p.lp DESC) AS rk
              FROM (SELECT participant_rowid, role, SUM(ll) AS ll FROM (SELECT * FROM nb_cont UNION ALL SELECT * FROM nb_flag) GROUP BY 1, 2) t
              JOIN nb_p p ON p.role = t.role
            ) WHERE rk = 1
          ),
          classified AS (
            SELECT mp.rowid AS participant_rowid, m.queue_id,
              COALESCE(g.ad, 0) AS ad_gold, COALESCE(g.ap, 0) AS ap_gold,
              COALESCE(g.tank, 0) AS tank_gold, COALESCE(g.sup, 0) AS sup_gold,
              COALESCE(g.ad + g.ap + g.tank + g.sup, 0) AS core_gold,
              CASE
                WHEN COALESCE(g.ad + g.ap + g.tank + g.sup, 0) = 0 THEN COALESCE(nr.role, '未成形')
                WHEN g.sup / (g.ad + g.ap + g.tank + g.sup) >= 0.35 THEN '輔助'
                WHEN g.tank / (g.ad + g.ap + g.tank + g.sup) >= 0.5
                     AND g.ad / (g.ad + g.ap + g.tank + g.sup) < 0.25
                     AND g.ap / (g.ad + g.ap + g.tank + g.sup) < 0.25 THEN '坦克'
                WHEN g.tank / (g.ad + g.ap + g.tank + g.sup) >= 0.3 THEN '鬥士'
                WHEN g.ad >= g.ap THEN
                  CASE WHEN g.ad_pen > g.ad_crit AND g.ad_pen > g.ad_as AND g.ad_pen > g.ad_other THEN '刺客'
                       WHEN mk.champion_id IS NOT NULL THEN '射手'
                       WHEN pr.role = 'assassin' THEN '刺客'
                       ELSE '鬥士' END
                WHEN pr.role = 'assassin' THEN '刺客'
                ELSE '法師'
              END AS build_role,
              CASE WHEN COALESCE(g.ad, 0) = 0 AND COALESCE(g.ap, 0) = 0 THEN '無'
                   WHEN g.ad >= g.ap THEN 'AD' ELSE 'AP' END AS damage_type,
              mp.dmg_to_champions * 100.0 / NULLIF(mp.team_dmg, 0) AS dmg_share,
              mp.dmg_taken * 100.0 / NULLIF(tt.taken, 0) AS taken_share,
              (mp.kills + mp.assists) * 100.0 / NULLIF(mp.team_kills, 0) AS kp
            FROM match_participants mp
            JOIN matches m ON m.platform_id = mp.platform_id AND m.game_id = mp.game_id AND m.is_remake = 0
            JOIN team_taken tt ON tt.platform_id = mp.platform_id AND tt.game_id = mp.game_id AND tt.team_id = mp.team_id
            LEFT JOIN gold g ON g.platform_id = mp.platform_id AND g.game_id = mp.game_id AND g.participant_id = mp.participant_id
            LEFT JOIN primary_role pr ON pr.champion_id = mp.champion_id
            LEFT JOIN marksman mk ON mk.champion_id = mp.champion_id
            LEFT JOIN nb_role nr ON nr.participant_rowid = mp.rowid
          )
          SELECT * FROM classified

    # 反方向也要一條：查詢裡有 builds 的指標時，Cube 會從這裡出發找 matches、participants 的路徑
    joins:
      - name: participants
        sql: "{CUBE}.participant_rowid = {participants}.rowid"
        relationship: one_to_one

    # 與 participants.yml 相同的 refresh key，理由寫在那裡。SQL 必須一字不差才會被合併。
    # 裝備類別只在服務重啟時重抓，重啟會一併清掉 Cube 的快取，不必另外納入。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    dimensions:
      - name: id
        sql: participant_rowid
        type: number
        primary_key: true
        public: false

      # 字串而不是數字比較：理由同 participants.is_me（CASE 運算式沒有型別親和性）
      - name: build_role
        title: 出裝定位
        description: "依終場裝備判斷的實際定位，六類：坦克、鬥士（坦度裝約一半，或鬥士英雄出 AD 輸出裝）、刺客（穿甲型 AD；或官方主定位是刺客的英雄出輸出裝）、射手（AD 輸出裝且英雄有官方射手定位）、法師（AP 輸出裝）、輔助，沒成裝的（太早結束等）不看裝備，用數字推斷，所以不會再出現未成形。AD／AP 看 damage_type。規則見 cube/model/cubes/builds.yml；和英雄的官方定位（champion_roles）不同，同一隻英雄不同場可能不一樣。"
        sql: build_role
        type: string
        meta:
          group: 配置

      - name: damage_type
        title: 出裝傷害類型
        description: "這場出裝的傷害類型：AD 裝金額 ≥ AP 裝金額是 AD，否則 AP；兩種都沒買（純坦、純輔助裝）是「無」。和出裝定位分開，例如鬥士可以是 AD 或 AP。"
        sql: damage_type
        type: string
        meta:
          group: 配置

      - name: ad_gold_share
        title: 出裝 AD 金額比例
        description: "成裝（不含鞋子與 1500 以下零件）裡，花在 AD 類裝備的金額比例（%）。"
        sql: "CASE WHEN core_gold > 0 THEN ROUND(ad_gold * 100.0 / core_gold, 1) END"
        type: number
        meta:
          group: 配置

      - name: ap_gold_share
        title: 出裝 AP 金額比例
        description: "成裝裡花在 AP 類裝備的金額比例（%）。"
        sql: "CASE WHEN core_gold > 0 THEN ROUND(ap_gold * 100.0 / core_gold, 1) END"
        type: number
        meta:
          group: 配置

      - name: tank_gold_share
        title: 出裝坦度金額比例
        description: "成裝裡花在生命／護甲／魔抗類裝備的金額比例（%）。"
        sql: "CASE WHEN core_gold > 0 THEN ROUND(tank_gold * 100.0 / core_gold, 1) END"
        type: number
        meta:
          group: 配置
