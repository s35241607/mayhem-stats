cubes:
  # 本場貢獻（work_score）：全站唯一的分數。計分板大數字、對局卡片、MVP／ACE、英雄頁、好友比較頁（含「打法」）都用它。
  # 規格與實測依據見 docs/contribution-scoring.md。
  #
  # 規則版本 v5.4（v5-B 修訂版，2026-11-15）。改下面任何一個常數、權重或公式，都要把 score_version 往上升，並重跑
  # analysis/scoring_v5_fit.py（重新產生校正常數）與 analysis/scoring_v5_check.py（獨立 Python 逐筆比對）。
  #
  #   v5.3 → v5.4（2026-11-15 非輸出定位高傷害轉型加成、有效擊殺解鎖與以攻代守負分豁免）：
  #     1. 修正坦克／輔助／鬥士打出高傷害時因核心輸出權重過低（10%/12%/28%）與跨界上限過小導致的低分問題：
  #        (a) 坦克於 zr_d > 0.45 或 zg_d > 0.20 時追加超額輸出斜率（+0.18×(zr_d-0.45) + 0.10×(zg_d-0.20)），
  #            輔助於 zr_d > 0.55 或 zg_d > -0.35 時追加超額輸出斜率（+0.16×(zr_d-0.55) + 0.12×(zg_d+0.35)），
  #            鬥士於 d_mix > 0.30 時邊際輸出權重由 0.28 升至 0.40（法師／射手／刺客亦同步微增高輸出斜率）；
  #        (b) 提高跨界高輸出獎勵 b_util_dmg 上限（坦克 2.5→4.0、輔助 2.0→3.5、鬥士新增上限 2.5）。
  #     2. 解鎖坦克與輔助的「有效擊殺加分（core_ks）」：
  #        k_eff = min(zr_k, zr_d + 0.40) 已受輸出上限約束（純尾刀不觸發），坦克於 k_eff > 0.30 給 +0.10×(k_eff-0.30)、
  #        輔助於 k_eff > 0.35 給 +0.09×(k_eff-0.35)、鬥士於 k_eff > 0.30 邊際擊殺權重升至 0.15。
  #     3. 「以攻代守」互補免責（高輸出時豁免本業副軸負向扣分）：
  #        (a) 無控場重裝坦克（歐拉夫、伊羅旖、魔鬥凱薩等）打出高輸出（zr_d > 0.30）或高承傷（zr_t > 0.35）時，豁免 zr_cc < 0 的控場扣分並同步豁免低承傷負分；
  #        (b) 半肉／拉扯型鬥士（剛普朗克、半肉法師／射手等）打出高輸出（d_mix > 0.20）時，豁免 t_mix < 0 的承傷扣分與 zr_cc < 0 的控場扣分；
  #        (c) 無控場法師於 d_mix > 0.20 時豁免 zr_cc < 0 扣分；Poke／AP 輔助於 zr_d > 0.65 時進一步墊高 zh_eff 與控場底線。
  #   v5.2 → v5.3（2026-11-15 敵方前排／血腥度校正與輔助暫估／高光修訂）：
  #     1. 修正敵方前排數（enemy_front）與對局血腥度（pace_k = clip(((e_k_pm / fac^-0.20) / 0.625), 0.75, 1.30)，其中 e_k_pm 為同場其餘九人每分鐘擊殺）
  #        對參團（adj_ka、adj_late_ka）與輸出（adj_d）的系統性偏差：
  #        adj_d = (x_d / fac^0.60) / ((1 + 0.115 × clip(enemy_front - 2, -2, 2)) × pace_k^0.28)，
  #        adj_ka 與 adj_late_ka 同步除以 (1 + 0.052 × clip(enemy_front - 2, -2, 2)) × pace_k^0.60，
  #        消除無前排拉扯局與少頭局的集體低分偏差，且因 pace_k 不含自身擊殺，自身多拿頭／助攻絕不倒扣。
  #     2. 改善輔助暫估局（score_status = estimate）與多流派（坦輔／控場功能輔／軟輔）計算：
  #        (a) 擴充輔助裝清單納入大亂鬥保人裝（破曉綻放之劍 124011、殞落之祭 123430、日輪的加冕 3190）；
  #        (b) calib_champ_shield 改存 EOG 實測高於 h_scale×h_flag 的隊友保人殘差，並以 (240×min(3, n_sup_items) - 0.25×h_scale×x_h) 作為先驗（權重 1.5），
  #            避免索拉卡／娜米等純補師被重複加計護盾，同時精準還原露璐／埃爾文／卡瑪／悠咪等護盾角保人量；
  #        (c) 放寬坦輔權重上限 tank_w 至 0.65，當輔助具備高承傷、高控場或高輸出時緩衝 zh_sup 負向底線並給予高保人額外加成，軟輔低輸出底線夾於 -0.35；
  #            暫估局不確定性權重微調為保人 0.34、參團 +0.04×(1-tank_w)、控場 +0.02×(1-tank_w)。
  #     3. 改善輔助高光加分（pts_bonus）與綜合經濟效率（b_eff）：
  #        (a) adj_imp_per_g 改採對齊後隊友保人量 h_aligned（暫估局非輔助不再計入自補灌水）並納入控場時間貢獻；
  #        (b) 輔助於高參團串連＋高主職表現時可獲 b_multi 團戰串連高光，後期關鍵參團＋保排控場協同可獲 b_fight 會戰高光，並開放輔助領取 b_util_cc。
  #   v5.1 → v5.2（2026-11-14 公平性、無資料補救與對局品質修訂）：
  #     1. 拿掉首殺（first_blood）、終結連殺與首塔／多人分攤拆塔次數：推塔高光改依每分鐘拆塔傷害（turret_dmg）計分，
  #        僅在獨自一人拆毀建築（match_building_events killer_id > 0 且 assist_ids='[]'）時加給單人拆塔獎勵。
  #     2. 對手前排硬度校正（enemy_front ∈ 0..5，來自 mat_comp_context）：
  #        adj_d = (x_d / fac^0.60) / (1 + 0.09 × clip(enemy_front - 2, -2, 2))，平衡無前排脆皮局總傷害天生較低問題。
  #     3. 暫估局（score_status = estimate，缺少 EOG 隊友護盾）輔助補救：
  #        (a) 依英雄＋終場輔助裝數量的貝氏護盾先驗（calib_champ_shield + 220×min(3, n_sup_items)）搭配個人參團活躍度估算隊友護盾，
  #            h_scale 改為 EOG 實測輔助「治療隊友／總治療」比例以對齊自補灌水；
  #        (b) 暫估局不確定性權重重分配（總和維持 1.00）：從核心保人降 0.12×(1-tank_w)，轉入參團（+0.07×(1-tank_w)）與控場（+0.05×(1-tank_w)）。
  #     4. 下修輸出位清兵權重（射手 0.10→0.06、刺客 0.10→0.03、法師 0.08→0.05）並補入主職核心；
  #        射手／刺客新增正向控場加分 core_c（zr_cc > 0.35 時 +0.05×(zr_cc-0.35)，0 控場不倒扣）；
  #        輸出／鬥士（射／刺／法／鬥）zr_cc > 0.65 時給 b_util_cc 功能控場獎勵（併入 pts_cc）。
  #   v5.0 → v5.1（2026-11-14 修訂四項誤判與比例）：
  #     1. 孤立死亡（ke_iso_death / ke_late_iso_death）補上「同隊 ±10 秒內死亡數 = 1」條件，不再把 5v5 團戰 0 換多敗戰誤標成單抓送頭，
  #        門檻底線同步調為 MAX(0.09, med_isod + 0.03)。
  #     2. 輔助參團改採同定位與全局 70/30 混合（0.70×zr_ka＋0.30×zg_ka），核心權重從參團 40%／坦保 34%／控場 8% 調為 坦保 40%／參團 32%／控場 10%，
  #        避免輔助靠高助攻自動灌出近 10 分卻稀釋保人與控場差異。
  #     3. 非坦輔順手保人獎（b_util_heal）限定 EOG 實測局才計算，排除暫估局自補治療對 units_healed >= 2 的灌水。
  #     4. 移除經濟轉換懲罰 p_econ（保留正向高效率 b_eff 獎勵），避免賺錢類海克斯增幅因總金幣變高遭誤扣；核心縮放從 21.5 調為 20.0 以減少 100 分夾頂。
  #   v3.x → v5.0（v5-B，使用者 2026-11-14 要求）：
  #     1. 改採 100% 跨場絕對尺度＋時長冪次校正 fac = (game_duration / 60) / 16.5，讓全場好就一起高分、全場爛就一起低分，
  #        不再把強弱場都壓在同一場比例裡互相抵銷。
  #     2. 拿掉強制各定位歸 50：僅做單一全局 EOG 有無偏移校正（pts_base），保留定位與玩家之間的真實強弱差異。
  #     3. 有效承傷改以自身減免為主（0.62×減免 ＋ 0.38×承傷），控場採次數與累計控場時長混合（0.65×zr_c ＋ 0.35×max(zr_c, zr_ccdur)）。
  #     4. 修正輔助計算：改用平滑坦克權重 tank_w = clip((eff_t - 1400) / 2200, 0, 0.55) 混合保人量與承傷；
  #        無賽後護盾時改以對局治療乘 h_scale 估算隊友治療；取消 max() 單向灌水。
  #     5. 新增擊殺時間軸（match_kill_events）與經濟效率因子：單殺、65% 時長後後期參團、±10 秒內孤立死亡／後期孤死／換命死亡、
  #        拆塔＋兵營、首殺／首塔／助攻、多殺、每千金輸出／綜合影響力。
  #     6. 核心分數超過 15 分時按 1.18 倍拉大強弱區分（upper stretch）；外加明確「高光加分（0..+15）」與「失誤扣分（-18..0）」。
  #
  # 1. 計分範圍：queue 2400、非重開、≥ 360 秒、雙方各 5 人。其他場次留一列但分數是空值，unscored_reason 寫原因。
  # 2. 九個基因＋高光／失誤＋整體校正：
  #      經時長冪次校正與 spow(x, med, scale, p=0.84) 對各定位中位數／IQR 與全局中位數／IQR 標準化（gene_* = 50 + 20×zr，夾 0～100）：
  #      輸出、承傷（0.62×減免＋0.38×承傷）、擊殺（取 min(zr_k, zr_d + 0.4)）、參團（K+A／分＋65% 後參團）、
  #      治療護盾（輔助用保人混合坦克承傷）、控場（次數／時長混合）、推塔、清兵、功能裝（帶重創／破盾估計擋掉的量），另有 K/DA（僅供打法展示）。
  # 3. 高光加分（pts_bonus，併入功能裝 pts_a 及單項工具獎勵 pts_d／pts_h／pts_c 共計 ≤ 15）：多殺、拆塔傷害與單人拆塔、換命優勢＋單殺、經濟效率、坦輔高輸出／輸出角順手補血與高控場及功能裝（不含首殺、首塔與終結）。
  # 4. 失誤扣分（pts_penalty，0～-18）：高頻孤立死亡（±10 秒內無隊友擊殺）、65% 後後期孤死、極低存在感隱身。
  # 5. 總分：work_score = 50 + sum(pts_*) + pts_base（夾 0～100），其中 pts_base 為 EOG／暫估全局平均補償。
  #
  # 限制：本場貢獻反映單場攻防、參團、推進與避險綜合表現；極端碾壓局或大後期翻盤局的多殺／孤死加成權重仍受 15/-18 上限約束。
  - name: contribution
    title: 本場貢獻
    # 規則本體在 meta.materialize.sql，每次入庫後由 features.py 重建 mat_contribution。改完重啟服務或 `uv run features.py`。
    # 用 | 而不是 >：SQL 裡有 -- 註解。
    sql_table: mat_contribution
    meta:
      materialize:
        table: mat_contribution
        sql: |
          WITH items AS (
            -- 功能裝（只看終場 slot 0–5）：重創／破盾／輔助保人裝備（含各模式同名變體）
            SELECT pi.platform_id, pi.game_id, pi.participant_id,
              MAX(pi.item_id IN (3033, 3075, 3076, 3123, 3165, 3916, 6609, 223033, 223075, 223165, 226609, 323075, 773075, 773123, 773165)) AS anti_heal_item,
              MAX(pi.item_id IN (6695, 226695)) AS anti_shield_item,
              SUM(CASE WHEN pi.item_id IN (6617, 4005, 2530, 3504, 6621, 3107, 6616, 3222, 6620, 2065, 2526, 124011, 123430, 3190) THEN 1 ELSE 0 END) AS n_sup_items
            FROM participant_items pi
            WHERE pi.slot < 6 AND pi.item_id > 0
            GROUP BY 1, 2, 3
          ),
          base AS (
            SELECT mp.rowid AS participant_rowid, mp.platform_id, mp.game_id, mp.participant_id, mp.team_id,
              mp.champion_id, m.queue_id, m.is_remake, m.game_duration,
              COALESCE(b.build_role, '未成形') AS build_role,
              COALESCE(cc.enemy_front, 2) AS enemy_front,
              COALESCE(i.n_sup_items, 0) AS n_sup_items,
              mp.dmg_to_champions, mp.dmg_taken, mp.dmg_mitigated, NULLIF(mp.gold_earned, 0) AS gold_earned,
              COALESCE(mp.double_kills, 0) AS double_kills, COALESCE(mp.triple_kills, 0) AS triple_kills,
              COALESCE(mp.quadra_kills, 0) AS quadra_kills, COALESCE(mp.penta_kills, 0) AS penta_kills,
              mp.dmg_to_champions * 60.0 / m.game_duration AS x_d,
              MAX(0.0, mp.total_damage - mp.dmg_to_champions - mp.dmg_to_objectives) * 60.0 / m.game_duration AS x_w,
              COALESCE(mp.turret_dmg, mp.dmg_to_objectives) * 60.0 / m.game_duration AS x_o,
              mp.dmg_mitigated * 60.0 / m.game_duration AS x_mit,
              mp.dmg_taken * 60.0 / m.game_duration AS x_tak,
              (mp.dmg_taken + mp.dmg_mitigated) * 60.0 / m.game_duration AS x_t,
              mp.time_ccing_others * 60.0 / m.game_duration AS x_c,
              COALESCE(mp.cc_duration, mp.time_ccing_others, 0) * 60.0 / m.game_duration AS x_cc_dur,
              mp.kills, mp.deaths, mp.assists,
              mp.kills * 60.0 / m.game_duration AS x_k,
              (mp.kills + mp.assists) * 60.0 / m.game_duration AS x_ka,
              mp.deaths * 60.0 / m.game_duration AS x_death,
              mp.total_heal * 60.0 / m.game_duration AS heal_all,
              (e.heal_on_teammates + e.shield_on_teammates) * 60.0 / m.game_duration AS h_eog,
              e.shield_on_teammates * 60.0 / m.game_duration AS shield_eog,
              CASE WHEN mp.units_healed >= 2 THEN mp.total_heal * 60.0 / m.game_duration
                   WHEN mp.units_healed IS NOT NULL THEN 0.0 END AS h_flag,
              COALESCE(i.anti_heal_item, 0) AS anti_heal_item, COALESCE(i.anti_shield_item, 0) AS anti_shield_item
            FROM match_participants mp
            JOIN matches m ON m.platform_id = mp.platform_id AND m.game_id = mp.game_id
            LEFT JOIN mat_builds b ON b.participant_rowid = mp.rowid
            LEFT JOIN mat_comp_context cc ON cc.participant_rowid = mp.rowid
            LEFT JOIN items i ON i.platform_id = mp.platform_id AND i.game_id = mp.game_id AND i.participant_id = mp.participant_id
            LEFT JOIN eog_player_stats e ON e.game_id = mp.game_id AND e.puuid = mp.puuid
          ),
          gate AS (
            SELECT *,
              CASE WHEN queue_id <> 2400 THEN 'other_queue'
                   WHEN is_remake = 1 OR game_duration < 360 THEN 'remake_or_short_game'
                   WHEN COUNT(*) OVER g <> 10 OR SUM(team_id = 100) OVER g <> 5 THEN 'incomplete_5v5'
                   WHEN COUNT(x_d) OVER g < 10 OR COUNT(x_t) OVER g < 10 OR COUNT(x_c) OVER g < 10 OR COUNT(x_w) OVER g < 10
                     OR COUNT(x_o) OVER g < 10 OR COUNT(kills) OVER g < 10 OR COUNT(assists) OVER g < 10 OR COUNT(x_death) OVER g < 10 OR COUNT(heal_all) OVER g < 10 THEN 'missing_main_axis'
              END AS unscored_reason,
              -- 本場十人都有賽後統計才用 eog，否則整場退回 flag（不混用：缺的人不能當 0）
              CASE WHEN COUNT(h_eog) OVER g = 10 THEN 'eog' WHEN COUNT(h_flag) OVER g = 10 THEN 'flag' END AS heal_src
            FROM base
            WINDOW g AS (PARTITION BY platform_id, game_id)
          ),
          scored_p AS (
            SELECT * FROM gate WHERE unscored_reason IS NULL AND heal_src IS NOT NULL
          ),
          ke AS (
            SELECT ke.platform_id, ke.game_id, ke.event_index, ke.time_ms, ke.killer_id, ke.victim_id,
              COALESCE(NULLIF(ke.assist_ids, ''), '[]') AS assist_ids,
              mk.team_id AS killer_team, mv.team_id AS victim_team,
              mv.game_duration * 1000.0 AS dur_ms, mv.participant_rowid AS victim_rid
            FROM match_kill_events ke
            JOIN scored_p mv ON mv.platform_id = ke.platform_id AND mv.game_id = ke.game_id AND mv.participant_id = ke.victim_id
            LEFT JOIN scored_p mk ON mk.platform_id = ke.platform_id AND mk.game_id = ke.game_id AND mk.participant_id = ke.killer_id
          ),
          ke_a AS (
            SELECT ke.platform_id, ke.game_id, ke.event_index, CAST(ja.value AS INTEGER) AS pid
            FROM match_kill_events ke, json_each(COALESCE(NULLIF(ke.assist_ids, ''), '[]')) ja
            WHERE EXISTS (
              SELECT 1 FROM scored_p mp
              WHERE mp.platform_id = ke.platform_id AND mp.game_id = ke.game_id AND mp.participant_id = ke.victim_id
            )
          ),
          ke_solo AS (
            SELECT platform_id, game_id, killer_id AS pid, COUNT(*) AS ke_solo
            FROM ke
            WHERE killer_id IS NOT NULL AND assist_ids = '[]'
            GROUP BY 1, 2, 3
          ),
          ke_late_ka AS (
            SELECT platform_id, game_id, pid, COUNT(*) AS ke_late_ka
            FROM (
              SELECT platform_id, game_id, event_index, killer_id AS pid FROM ke WHERE time_ms >= 0.65 * dur_ms AND killer_id IS NOT NULL
              UNION
              SELECT ka.platform_id, ka.game_id, ka.event_index, ka.pid
              FROM ke_a ka JOIN ke USING (platform_id, game_id, event_index)
              WHERE ke.time_ms >= 0.65 * ke.dur_ms
            )
            GROUP BY 1, 2, 3
          ),
          ke_death_win AS (
            SELECT victim_rid, time_ms, dur_ms, victim_team,
              SUM(CASE WHEN killer_team = 100 THEN 1 ELSE 0 END) OVER w AS k100_near,
              SUM(CASE WHEN killer_team = 200 THEN 1 ELSE 0 END) OVER w AS k200_near,
              SUM(CASE WHEN victim_team = 100 THEN 1 ELSE 0 END) OVER w AS d100_near,
              SUM(CASE WHEN victim_team = 200 THEN 1 ELSE 0 END) OVER w AS d200_near
            FROM ke
            WINDOW w AS (PARTITION BY platform_id, game_id ORDER BY time_ms RANGE BETWEEN 10000 PRECEDING AND 10000 FOLLOWING)
          ),
          ke_deaths AS (
            SELECT victim_rid AS participant_rowid,
              SUM(CASE WHEN (CASE WHEN victim_team = 100 THEN k100_near ELSE k200_near END) = 0
                        AND (CASE WHEN victim_team = 100 THEN d100_near ELSE d200_near END) = 1 THEN 1 ELSE 0 END) AS ke_iso_death,
              SUM(CASE WHEN (CASE WHEN victim_team = 100 THEN k100_near ELSE k200_near END) = 0
                        AND (CASE WHEN victim_team = 100 THEN d100_near ELSE d200_near END) = 1
                        AND time_ms >= 0.65 * dur_ms THEN 1 ELSE 0 END) AS ke_late_iso_death,
              SUM(CASE WHEN (CASE WHEN victim_team = 100 THEN k100_near ELSE k200_near END) >= 2 THEN 1 ELSE 0 END) AS ke_trade_death
            FROM ke_death_win
            GROUP BY victim_rid
          ),
          ke_solo_tur AS (
            SELECT be.platform_id, be.game_id, be.killer_id AS pid, COUNT(*) AS ke_solo_tur
            FROM match_building_events be
            JOIN scored_p mk ON mk.platform_id = be.platform_id AND mk.game_id = be.game_id AND mk.participant_id = be.killer_id
            WHERE be.killer_id IS NOT NULL AND be.killer_id > 0
              AND COALESCE(NULLIF(be.assist_ids, ''), '[]') = '[]'
            GROUP BY 1, 2, 3
          ),
          team AS (
            SELECT sp.*,
              CASE sp.heal_src WHEN 'eog' THEN sp.h_eog ELSE sp.h_flag END AS x_h,
              SUM(sp.heal_all) OVER g - SUM(sp.heal_all) OVER t AS foe_heal,
              CASE WHEN sp.heal_src = 'eog' THEN SUM(sp.shield_eog) OVER g - SUM(sp.shield_eog) OVER t ELSE 0.0 END AS foe_shield,
              SUM(sp.anti_heal_item) OVER t AS team_anti_heal, SUM(sp.anti_shield_item) OVER t AS team_anti_shield,
              CASE WHEN SUM(sp.kills) OVER t = 0 THEN 0.0 ELSE (sp.kills + sp.assists) * 1.0 / SUM(sp.kills) OVER t END AS x_kp,
              CASE WHEN SUM(sp.kills) OVER t = 0 THEN 0.0 ELSE sp.kills * 1.0 / SUM(sp.kills) OVER t END AS x_ks,
              COALESCE(ks.ke_solo, 0) AS ke_solo,
              COALESCE(kl.ke_late_ka, 0) AS ke_late_ka,
              COALESCE(kd.ke_iso_death, 0) AS ke_iso_death,
              COALESCE(kd.ke_late_iso_death, 0) AS ke_late_iso_death,
              COALESCE(kd.ke_trade_death, 0) AS ke_trade_death,
              COALESCE(kt.ke_solo_tur, 0) AS ke_solo_tur
            FROM scored_p sp
            LEFT JOIN ke_solo ks ON ks.platform_id = sp.platform_id AND ks.game_id = sp.game_id AND ks.pid = sp.participant_id
            LEFT JOIN ke_late_ka kl ON kl.platform_id = sp.platform_id AND kl.game_id = sp.game_id AND kl.pid = sp.participant_id
            LEFT JOIN ke_deaths kd ON kd.participant_rowid = sp.participant_rowid
            LEFT JOIN ke_solo_tur kt ON kt.platform_id = sp.platform_id AND kt.game_id = sp.game_id AND kt.pid = sp.participant_id
            WINDOW g AS (PARTITION BY sp.platform_id, sp.game_id), t AS (PARTITION BY sp.platform_id, sp.game_id, sp.team_id)
          ),
          genes AS (
            SELECT *,
              game_duration / 60.0 AS mins,
              (game_duration / 60.0) / 16.5 AS fac,
              MIN(1.30, MAX(0.75, (((SUM(x_k) OVER g - x_k) / 9.0) / POWER((game_duration / 60.0) / 16.5, -0.20)) / 0.625)) AS pace_k,
              CASE WHEN anti_heal_item = 1 THEN 0.4 * foe_heal / team_anti_heal ELSE 0.0 END
                + CASE WHEN anti_shield_item = 1 THEN 0.4 * foe_shield / team_anti_shield ELSE 0.0 END AS x_a,
              (SUM(x_d) OVER g - x_d) / 9.0 AS e_d, (SUM(x_w) OVER g - x_w) / 9.0 AS e_w, (SUM(x_o) OVER g - x_o) / 9.0 AS e_o,
              (SUM(x_t) OVER g - x_t) / 9.0 AS e_t, (SUM(x_c) OVER g - x_c) / 9.0 AS e_c, (SUM(x_kp) OVER g - x_kp) / 9.0 AS e_k,
              (SUM(x_death) OVER g - x_death) / 9.0 AS e_death, (SUM(x_ks) OVER g - x_ks) / 9.0 AS e_ks
            FROM team
            WINDOW g AS (PARTITION BY platform_id, game_id)
          ),
          -- 校正常數開始（analysis/scoring_v5_fit.py 產生，v5.4 / v5-B 修訂版 2026-11-15；寫死，新增對局不會改舊分）
          calib_role(
            build_role, med_d, iqr_d, med_t, iqr_t, med_c, iqr_c, med_ccdur, iqr_ccdur,
            med_w, iqr_w, med_o, iqr_o, med_k, iqr_k, med_ka, iqr_ka, med_multi, med_isod, med_p_kda
          ) AS (
            VALUES
              ('射手', 2192.913031, 1145.443657, 1125.813473, 1105.189180, 0.627907, 1.226138, 3.929204, 6.745770, 3002.047488, 1734.090679, 140.185240, 180.361757, 0.725806, 0.487360, 2.160684, 0.709839, 3.000000, 0.000000, 50.052197),
              ('法師', 1992.085059, 992.846209, 1152.848180, 1105.189180, 1.966173, 1.711866, 11.280323, 12.101977, 2100.794117, 1245.969813, 74.758830, 109.102486, 0.524017, 0.374401, 2.170867, 0.685956, 1.000000, 0.000000, 51.331754),
              ('刺客', 2161.836965, 951.600062, 1682.046477, 1105.189180, 0.832611, 1.233056, 5.000000, 7.661201, 1698.702683, 1220.078880, 99.533559, 147.964721, 0.763209, 0.472173, 2.082201, 0.652988, 3.000000, 0.000000, 48.904178),
              ('鬥士', 2034.977210, 1060.979935, 2630.241111, 1376.752533, 1.438561, 1.272660, 6.012526, 7.634990, 2128.383590, 1527.846286, 94.010086, 135.961521, 0.617849, 0.449332, 2.061600, 0.683436, 2.000000, 0.000000, 48.566910),
              ('坦克', 1585.151724, 888.876919, 4420.611384, 1811.277946, 2.705570, 1.906064, 10.248869, 10.618123, 1143.277733, 1037.951682, 43.049615, 84.819318, 0.401786, 0.356571, 2.107988, 0.670572, 1.000000, 0.000000, 50.325265),
              ('輔助', 747.004016, 694.577344, 1140.705693, 1105.189180, 2.167969, 1.854082, 11.311475, 7.709696, 559.408283, 1034.152798, 43.888406, 84.819318, 0.163154, 0.299406, 2.526154, 0.702837, 0.000000, 0.000000, 57.254825),
              ('未成形', 1960.674295, 1068.580529, 1598.289661, 1700.291045, 1.562219, 1.803565, 7.714291, 10.188549, 1998.093451, 1591.004305, 83.553271, 130.491258, 0.574038, 0.460624, 2.137892, 0.699133, 1.000000, 0.000000, 50.272145)
          ),
          calib_champ_shield(champion_id, n_sup, sum_sh_pm) AS (
            VALUES
              (0, 0, 0.000000),
              (3, 1, 192.844037),
              (12, 1, 0.000000),
              (16, 13, 2617.559198),
              (22, 1, 0.000000),
              (35, 1, 0.000000),
              (37, 22, 10029.955804),
              (40, 16, 12348.891322),
              (43, 7, 6762.649091),
              (44, 1, 0.000000),
              (48, 2, 0.000000),
              (76, 2, 129.498264),
              (99, 1, 654.058931),
              (117, 8, 6712.083577),
              (147, 3, 742.192323),
              (235, 1, 276.478768),
              (267, 9, 738.895151),
              (350, 18, 14563.834701),
              (412, 1, 0.000000),
              (427, 10, 11639.603060),
              (432, 1, 582.831105),
              (888, 5, 1754.467317),
              (902, 4, 2409.161516)
          ),
          calib_global(
            h_scale, h_sup_med, h_sup_iqr,
            med_d, iqr_d, med_t, iqr_t, med_w, iqr_w, med_o, iqr_o, med_c, iqr_c, med_ccdur, iqr_ccdur,
            med_k, iqr_k, med_ka, iqr_ka, med_lka, iqr_lka, med_dpg, iqr_dpg, med_ipg, iqr_ipg,
            core_sd, g_mean_eog, g_mean_est, sd_p_kda
          ) AS (
            VALUES (0.620922, 1207.801875, 639.841950, 1960.674295, 1068.580529, 1598.289661, 1700.291045, 1998.093451, 1591.004305, 83.553271, 130.491258, 1.562219, 1.803565, 7.714291, 10.188549, 0.574038, 0.460624, 2.137892, 0.699133, 0.677118, 0.358284, 2.016598, 0.971939, 3393.864307, 1480.646972, 0.581608, 11.295682, 9.569918, 4.431708)
            -- 校正常數結束
          ),
          parts AS (
            SELECT ge.*,
              (ge.x_d / POWER(ge.fac, 0.60)) / ((1.0 + 0.115 * MIN(2, MAX(-2, ge.enemy_front - 2))) * POWER(ge.pace_k, 0.28)) AS adj_d,
              0.62 * (ge.x_mit / POWER(ge.fac, 0.75)) + 0.38 * (ge.x_tak / POWER(ge.fac, 0.60)) AS eff_t,
              ge.x_w / POWER(ge.fac, 1.00) AS adj_w,
              ge.x_o / POWER(ge.fac, 0.25) AS adj_o,
              ge.x_c AS adj_c,
              ge.x_cc_dur AS adj_cc_dur,
              ge.x_k AS adj_k,
              (ge.x_ka / POWER(ge.fac, -0.20)) / ((1.0 + 0.052 * MIN(2, MAX(-2, ge.enemy_front - 2))) * POWER(ge.pace_k, 0.60)) AS adj_ka,
              ((ge.ke_late_ka * 1.0 / ge.mins) / POWER(ge.fac, -0.25)) / ((1.0 + 0.052 * MIN(2, MAX(-2, ge.enemy_front - 2))) * POWER(ge.pace_k, 0.60)) AS adj_late_ka,
              ge.ke_iso_death * 1.0 / ge.mins AS adj_iso_d,
              ge.ke_iso_death * 1.0 / MAX(ge.deaths, 1) AS iso_ratio,
              CASE WHEN ge.gold_earned IS NOT NULL THEN (ge.dmg_to_champions * 1.0 / ge.gold_earned) / POWER(ge.fac, 0.50) END AS adj_d_per_g,
              ge.double_kills + 2.5 * ge.triple_kills + 4.5 * ge.quadra_kills + 7.5 * ge.penta_kills AS mk_score,
              CASE WHEN ge.x_d = 0 THEN 0.0 WHEN ge.e_d = 0 THEN 100.0 ELSE 100.0 * ge.x_d / (ge.x_d + ge.e_d) END AS p_d,
              CASE WHEN ge.x_w = 0 THEN 0.0 WHEN ge.e_w = 0 THEN 100.0 ELSE 100.0 * ge.x_w / (ge.x_w + ge.e_w) END AS p_w,
              CASE WHEN ge.x_o = 0 THEN 0.0 WHEN ge.e_o = 0 THEN 100.0 ELSE 100.0 * ge.x_o / (ge.x_o + ge.e_o) END AS p_o,
              CASE WHEN ge.x_t = 0 THEN 0.0 WHEN ge.e_t = 0 THEN 100.0 ELSE 100.0 * ge.x_t / (ge.x_t + ge.e_t) END AS p_t,
              CASE WHEN ge.x_c = 0 THEN 0.0 WHEN ge.e_c = 0 THEN 100.0 ELSE 100.0 * ge.x_c / (ge.x_c + ge.e_c) END AS p_c,
              CASE WHEN ge.x_kp = 0 THEN 0.0 WHEN ge.e_k = 0 THEN 100.0 ELSE 100.0 * ge.x_kp / (ge.x_kp + ge.e_k) END AS p_k,
              CASE WHEN ge.x_ks = 0 THEN 0.0 WHEN ge.e_ks = 0 THEN 100.0 ELSE 100.0 * ge.x_ks / (ge.x_ks + ge.e_ks) END AS p_ks,
              CASE WHEN ge.x_death = 0 THEN 100.0 WHEN ge.e_death = 0 THEN 0.0 ELSE 100.0 * ge.e_death / (ge.x_death + ge.e_death) END AS p_s,
              100.0 * ge.x_h / (ge.x_h + CASE ge.heal_src WHEN 'eog' THEN 1250.0 ELSE 1100.0 END) AS p_h,
              100.0 * ge.x_a / (ge.x_a + 630.0) AS p_a,
              (
                CASE WHEN ge.x_kp = 0 THEN 0.0 WHEN ge.e_k = 0 THEN 100.0 ELSE 100.0 * ge.x_kp / (ge.x_kp + ge.e_k) END
                + CASE WHEN ge.x_death = 0 THEN 100.0 WHEN ge.e_death = 0 THEN 0.0 ELSE 100.0 * ge.e_death / (ge.x_death + ge.e_death) END
              ) / 2.0 AS p_kda
            FROM genes ge
          ),
          h_calc AS (
            SELECT p.*,
              CASE p.heal_src
                WHEN 'eog' THEN p.x_h
                WHEN 'flag' THEN
                  CASE WHEN p.build_role = '輔助' THEN
                    cg.h_scale * p.x_h
                    + ((COALESCE(csh.sum_sh_pm, 0.0) + 1.5 * MAX(0.0, 240.0 * MIN(3, p.n_sup_items) - 0.25 * cg.h_scale * p.x_h)) / (COALESCE(csh.n_sup, 0) + 1.5))
                      * MIN(1.25, MAX(0.45, 0.20 + 0.80 * (p.adj_ka / cr.med_ka)))
                  ELSE cg.h_scale * p.x_h END
              END AS h_aligned
            FROM parts p
            JOIN calib_role cr ON cr.build_role = p.build_role
            LEFT JOIN calib_champ_shield csh ON csh.champion_id = p.champion_id
            CROSS JOIN calib_global cg
          ),
          spow_calc AS (
            SELECT p.*, cr.med_multi, cr.med_isod, cr.med_p_kda,
              cg.core_sd, cg.g_mean_eog, cg.g_mean_est, cg.sd_p_kda,
              MIN(4.0, MAX(-3.2, SIGN((p.adj_d - cr.med_d) / cr.iqr_d) * POWER(ABS((p.adj_d - cr.med_d) / cr.iqr_d), 0.84))) AS zr_d,
              MIN(4.0, MAX(-3.2, SIGN((p.eff_t - cr.med_t) / cr.iqr_t) * POWER(ABS((p.eff_t - cr.med_t) / cr.iqr_t), 0.84))) AS zr_t,
              MIN(4.0, MAX(-3.2, SIGN((p.adj_c - cr.med_c) / cr.iqr_c) * POWER(ABS((p.adj_c - cr.med_c) / cr.iqr_c), 0.84))) AS zr_c,
              MIN(4.0, MAX(-3.2, SIGN((p.adj_cc_dur - cr.med_ccdur) / cr.iqr_ccdur) * POWER(ABS((p.adj_cc_dur - cr.med_ccdur) / cr.iqr_ccdur), 0.84))) AS zr_ccdur,
              MIN(2.5, MAX(-2.0, SIGN((p.adj_w - cr.med_w) / cr.iqr_w) * POWER(ABS((p.adj_w - cr.med_w) / cr.iqr_w), 0.84))) AS zr_w,
              MIN(2.8, MAX(-1.4, SIGN((p.adj_o - cr.med_o) / cr.iqr_o) * POWER(ABS((p.adj_o - cr.med_o) / cr.iqr_o), 0.84))) AS zr_o,
              MIN(4.0, MAX(-3.2, SIGN((p.adj_k - cr.med_k) / cr.iqr_k) * POWER(ABS((p.adj_k - cr.med_k) / cr.iqr_k), 0.84))) AS zr_k,
              MIN(4.0, MAX(-3.2, SIGN((p.adj_ka - cr.med_ka) / cr.iqr_ka) * POWER(ABS((p.adj_ka - cr.med_ka) / cr.iqr_ka), 0.84))) AS zr_ka,
              MIN(4.0, MAX(-3.2, SIGN((p.adj_d - cg.med_d) / cg.iqr_d) * POWER(ABS((p.adj_d - cg.med_d) / cg.iqr_d), 0.84))) AS zg_d,
              MIN(4.0, MAX(-3.2, SIGN((p.eff_t - cg.med_t) / cg.iqr_t) * POWER(ABS((p.eff_t - cg.med_t) / cg.iqr_t), 0.84))) AS zg_t,
              MIN(4.0, MAX(-3.2, SIGN((p.adj_ka - cg.med_ka) / cg.iqr_ka) * POWER(ABS((p.adj_ka - cg.med_ka) / cg.iqr_ka), 0.84))) AS zg_ka,
              MIN(4.0, MAX(-3.2, SIGN((p.adj_late_ka - cg.med_lka) / cg.iqr_lka) * POWER(ABS((p.adj_late_ka - cg.med_lka) / cg.iqr_lka), 0.84))) AS zg_lka,
              MIN(2.8, MAX(-1.4, SIGN((p.adj_o - cg.med_o) / cg.iqr_o) * POWER(ABS((p.adj_o - cg.med_o) / cg.iqr_o), 0.84))) AS zg_o,
              MIN(3.6, MAX(-1.8, SIGN((p.h_aligned - cg.h_sup_med) / cg.h_sup_iqr) * POWER(ABS((p.h_aligned - cg.h_sup_med) / cg.h_sup_iqr), 0.84))) AS zh_sup,
              MIN(0.65, MAX(0.0, (p.eff_t - 1350.0) / 2100.0)) AS tank_w,
              CASE WHEN p.gold_earned IS NULL THEN 0.0
                   WHEN p.build_role IN ('射手', '法師', '刺客') THEN (p.adj_d_per_g - cg.med_dpg) / cg.iqr_dpg
                   ELSE (
                     ((1000.0 * (p.dmg_to_champions + 0.25 * (p.dmg_taken + p.dmg_mitigated) + 1.80 * (CASE WHEN p.build_role = '輔助' OR p.heal_src = 'eog' THEN p.h_aligned ELSE 0.0 END) * p.mins + 110.0 * p.adj_c * p.mins) / p.gold_earned) / POWER(p.fac, 0.55) - cg.med_ipg) / cg.iqr_ipg
                   ) END AS eff_z
            FROM h_calc p
            JOIN calib_role cr ON cr.build_role = p.build_role
            CROSS JOIN calib_global cg
          ),
          mixed AS (
            SELECT *,
              0.65 * zr_c + 0.35 * MAX(zr_c, zr_ccdur) AS zr_cc,
              MIN(zr_k, zr_d + 0.40) AS k_eff,
              0.70 * zr_d + 0.30 * zg_d AS d_mix,
              0.40 * zr_o + 0.60 * zg_o AS o_mix,
              0.85 * zr_t + 0.15 * zg_t AS t_mix,
              CASE WHEN build_role = '輔助' THEN 0.70 * zr_ka + 0.30 * zg_ka ELSE zg_ka END AS ka_mix
            FROM spow_calc
          ),
          scored_parts AS (
            SELECT *,
              CASE build_role
                WHEN '射手' THEN 0.40 * d_mix + 0.04 * MAX(0.0, d_mix - 0.45)
                WHEN '刺客' THEN 0.41 * d_mix + 0.04 * MAX(0.0, d_mix - 0.45)
                WHEN '法師' THEN 0.38 * d_mix + 0.05 * MAX(0.0, d_mix - 0.40)
                WHEN '鬥士' THEN 0.28 * d_mix + 0.12 * MAX(0.0, d_mix - 0.30)
                WHEN '坦克' THEN 0.10 * zr_d + 0.18 * MAX(0.0, zr_d - 0.45) + 0.10 * MAX(0.0, zg_d - 0.20)
                WHEN '輔助' THEN 0.12 * MAX(-0.35, zr_d) + 0.16 * MAX(0.0, zr_d - 0.55) + 0.12 * MAX(0.0, zg_d + 0.35)
                ELSE 0.28 * d_mix + 0.10 * MAX(0.0, d_mix - 0.35) END AS core_d,
              CASE build_role
                WHEN '鬥士' THEN 0.20 * (CASE WHEN d_mix > 0.20 THEN MAX(t_mix, MIN(0.0, -0.85 + 0.90 * (d_mix - 0.20))) ELSE t_mix END)
                WHEN '坦克' THEN 0.30 * (CASE WHEN zr_d > 0.35 THEN MAX(t_mix, MIN(0.0, -0.85 + 0.85 * (zr_d - 0.35))) ELSE t_mix END)
                WHEN '輔助' THEN 0.42 * tank_w * zr_t
                WHEN '未成形' THEN 0.18 * t_mix
                ELSE 0.0 END AS core_t,
              CASE build_role
                WHEN '射手' THEN 0.15 * k_eff
                WHEN '刺客' THEN 0.17 * k_eff
                WHEN '法師' THEN 0.13 * k_eff
                WHEN '鬥士' THEN 0.11 * k_eff + 0.04 * MAX(0.0, k_eff - 0.30)
                WHEN '坦克' THEN 0.10 * MAX(0.0, k_eff - 0.30)
                WHEN '輔助' THEN 0.09 * MAX(0.0, k_eff - 0.35)
                WHEN '未成形' THEN 0.11 * k_eff
                ELSE 0.0 END AS core_ks,
              CASE build_role
                WHEN '射手' THEN 0.17 * ka_mix + 0.12 * zg_lka
                WHEN '刺客' THEN 0.17 * ka_mix + 0.12 * zg_lka
                WHEN '法師' THEN 0.16 * ka_mix + 0.12 * zg_lka
                WHEN '鬥士' THEN 0.16 * ka_mix + 0.11 * zg_lka
                WHEN '坦克' THEN 0.19 * ka_mix + 0.13 * zg_lka
                WHEN '輔助' THEN (CASE WHEN heal_src = 'flag' THEN 0.22 + 0.04 * (1.0 - tank_w) ELSE 0.22 END) * ka_mix + 0.10 * zg_lka
                ELSE 0.16 * ka_mix + 0.11 * zg_lka END AS core_ka,
              CASE WHEN build_role = '輔助' THEN
                (CASE WHEN heal_src = 'flag' THEN 0.34 ELSE 0.40 END) * (1.0 - tank_w) * (
                  (CASE WHEN tank_w > 0.0 OR zr_cc > 0.20 OR zr_d > 0.20
                        THEN MAX(zh_sup, -1.15 + 0.65 * tank_w + 0.45 * MIN(2.0, MAX(0.0, zr_cc - 0.20) + 0.80 * MAX(0.0, zr_d - 0.20) + 0.55 * MAX(0.0, zr_d - 0.65)))
                        ELSE zh_sup END)
                  + 0.10 * MAX(0.0, zh_sup - 0.35)
                )
              ELSE 0.0 END AS core_h,
              CASE
                WHEN build_role IN ('射手', '刺客') THEN CASE WHEN zr_cc > 0.35 THEN 0.05 * (zr_cc - 0.35) ELSE 0.0 END
                WHEN build_role = '法師' THEN 0.08 * (CASE WHEN d_mix > 0.20 THEN MAX(zr_cc, MIN(0.0, -0.90 + 0.90 * (d_mix - 0.20))) ELSE zr_cc END)
                WHEN build_role = '鬥士' THEN 0.07 * (CASE WHEN d_mix > 0.20 OR t_mix > 0.25 THEN MAX(zr_cc, MIN(0.0, -0.90 + 0.85 * MAX(0.0, d_mix - 0.20) + 0.35 * MAX(0.0, t_mix - 0.25))) ELSE zr_cc END)
                WHEN build_role = '坦克' THEN 0.20 * (CASE WHEN zr_d > 0.30 OR zr_t > 0.35 THEN MAX(zr_cc, MIN(0.0, -1.05 + 0.90 * MAX(0.0, zr_d - 0.30) + 0.30 * MAX(0.0, zr_t - 0.35))) ELSE zr_cc END)
                WHEN build_role = '輔助' THEN (CASE WHEN heal_src = 'flag' THEN 0.10 + 0.02 * (1.0 - tank_w) ELSE 0.10 END) * MAX(-0.45, zr_cc, MIN(0.0, -0.45 + 0.45 * MAX(0.0, zr_d - 0.45)))
                ELSE 0.08 * zr_cc END AS core_c,
              CASE build_role
                WHEN '射手' THEN 0.10 * o_mix
                WHEN '刺客' THEN 0.10 * o_mix
                WHEN '法師' THEN 0.08 * o_mix
                WHEN '鬥士' THEN 0.07 * o_mix
                WHEN '坦克' THEN 0.08 * o_mix
                WHEN '輔助' THEN 0.06 * o_mix
                ELSE 0.08 * o_mix END AS core_o,
              CASE build_role
                WHEN '射手' THEN 0.06 * zr_w
                WHEN '刺客' THEN 0.03 * zr_w
                WHEN '法師' THEN 0.05 * zr_w
                ELSE 0.0 END AS core_w,
              MIN(4.5, 1.5 * SQRT(MAX(0.0, mk_score - (med_multi + 1.5)))
                + CASE WHEN build_role = '輔助' THEN 1.8 * MAX(0.0, ka_mix - 0.50) + 1.5 * MAX(0.0, MAX(zh_sup, zr_cc, zr_t) - 0.55) ELSE 0.0 END) AS b_multi,
              MIN(3.5, 1.8 * MAX(0.0, zr_o - 0.50) + CASE WHEN ke_solo_tur >= 2 THEN 3.0 WHEN ke_solo_tur = 1 THEN 2.0 ELSE 0.0 END) AS b_tur,
              MIN(3.5, 1.2 * SQRT(MAX(0, ke_trade_death - ke_iso_death - 1)) + 0.9 * MIN(2, ke_solo)
                + CASE WHEN build_role = '輔助' THEN 1.2 * MAX(0.0, zg_lka - 0.35) + 0.9 * MAX(0.0, MIN(ka_mix, MAX(zh_sup, zr_cc, zr_t)) - 0.25) ELSE 0.0 END) AS b_fight,
              MIN(3.5, 3.0 * MAX(0.0, eff_z - 0.50)) AS b_eff,
              CASE WHEN x_a > 200.0 THEN MIN(2.5, 2.2 * MIN(1.2, x_a / 630.0)) ELSE 0.0 END AS b_anti,
              CASE WHEN build_role = '坦克' AND zr_d > 0.45 THEN MIN(4.0, 2.6 * (zr_d - 0.45))
                   WHEN build_role = '輔助' AND zr_d > 0.45 THEN MIN(3.5, 2.4 * (zr_d - 0.45))
                   WHEN build_role = '鬥士' AND zr_d > 0.60 THEN MIN(2.5, 2.0 * (zr_d - 0.60))
                   ELSE 0.0 END AS b_util_dmg,
              CASE WHEN build_role NOT IN ('坦克', '輔助') AND heal_src = 'eog' AND h_aligned > 500.0 THEN MIN(2.0, (h_aligned - 500.0) / 500.0)
                   ELSE 0.0 END AS b_util_heal,
              CASE WHEN build_role IN ('射手', '刺客', '法師', '鬥士', '輔助') AND zr_cc > 0.65 THEN MIN(2.5, 2.0 * (zr_cc - 0.65))
                   ELSE 0.0 END AS b_util_cc,
              CASE WHEN adj_iso_d > MAX(0.09, med_isod + 0.03) AND iso_ratio > 0.25
                   THEN MIN(7.0, 28.0 * (adj_iso_d - MAX(0.09, med_isod + 0.03)) * MIN(1.5, iso_ratio / 0.35))
                   ELSE 0.0 END AS p_iso,
              MIN(5.0, 2.2 * MAX(0, ke_late_iso_death - 1)) AS p_late,
              MIN(8.0, 6.5 * MAX(0.0, -0.75 - MAX(zr_d, zr_t, CASE WHEN build_role = '輔助' THEN zh_sup ELSE -1.0 END)) + 4.5 * MAX(0.0, -0.80 - ka_mix)) AS p_ghost
            FROM mixed
          ),
          calc_core AS (
            SELECT *,
              (core_d + core_t + core_ks + core_ka + core_h + core_c + core_o + core_w) AS core,
              (b_multi + b_tur + b_fight + b_eff + b_anti + b_util_dmg + b_util_heal + b_util_cc) AS bonus_raw,
              MIN(15.0, b_multi + b_tur + b_fight + b_eff + b_anti + b_util_dmg + b_util_heal + b_util_cc) AS bonus_pts,
              MIN(18.0, p_iso + p_late + p_ghost) AS pen_pts,
              CASE heal_src WHEN 'eog' THEN g_mean_eog ELSE g_mean_est END AS g_mean_off
            FROM scored_parts
          ),
          total AS (
            SELECT *,
              (20.0 / core_sd) * (CASE WHEN (20.0 * core / core_sd) > 15.0 THEN (15.0 + 1.18 * ((20.0 * core / core_sd) - 15.0)) / (20.0 * core / core_sd) ELSE 1.0 END) AS k_core,
              CASE WHEN bonus_raw > 0.0 THEN bonus_pts / bonus_raw ELSE 1.0 END AS b_scale
            FROM calc_core
          )
          SELECT g.participant_rowid, 'v5.4' AS score_version,
            CASE WHEN g.unscored_reason IS NOT NULL OR g.heal_src IS NULL THEN 'unscored'
                 WHEN t.heal_src = 'eog' THEN 'complete' ELSE 'estimate' END AS score_status,
            COALESCE(g.unscored_reason, CASE WHEN g.heal_src IS NULL THEN 'missing_heal_data' END) AS unscored_reason,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + (t.core * t.k_core + t.bonus_pts - t.pen_pts) - t.g_mean_off)), 9) AS work_score,
            ROUND(t.core * t.k_core + t.bonus_pts - t.pen_pts, 9) AS work_raw,
            g.build_role, t.heal_src,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.zr_d)), 9) AS gene_d,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.zr_w)), 9) AS gene_w,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.zr_o)), 9) AS gene_o,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.zr_t)), 9) AS gene_t,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.zr_cc)), 9) AS gene_c,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.zh_sup)), 9) AS gene_h,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * ((t.x_a - 200.0) / 430.0))), 9) AS gene_a,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * ((t.p_kda - t.med_p_kda) / t.sd_p_kda))), 9) AS gene_kda,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.zr_k)), 9) AS gene_ks,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.zr_ka)), 9) AS gene_ka,
            ROUND(t.core_d * t.k_core + t.b_util_dmg * t.b_scale, 9) AS pts_d,
            ROUND(t.core_w * t.k_core, 9) AS pts_w,
            ROUND(t.core_o * t.k_core, 9) AS pts_o,
            ROUND(t.core_t * t.k_core, 9) AS pts_t,
            ROUND(t.core_c * t.k_core + t.b_util_cc * t.b_scale, 9) AS pts_c,
            ROUND(t.core_h * t.k_core + t.b_util_heal * t.b_scale, 9) AS pts_h,
            ROUND(t.b_anti * t.b_scale, 9) AS pts_a,
            ROUND(t.core_ks * t.k_core, 9) AS pts_ks,
            ROUND(t.core_ka * t.k_core, 9) AS pts_ka,
            ROUND((t.b_multi + t.b_tur + t.b_fight + t.b_eff) * t.b_scale, 9) AS pts_bonus,
            ROUND(-t.pen_pts, 9) AS pts_penalty,
            ROUND(-t.g_mean_off, 9) AS pts_base,
            t.p_d, t.p_w, t.p_o, t.p_t, t.p_c, t.p_h, t.p_a, t.p_k, t.p_s, t.p_kda, t.p_ks,
            t.x_d, t.x_w, t.x_o, t.x_t, t.x_c, t.x_h, t.x_a, t.x_kp, t.x_ks, t.x_death, t.foe_heal, t.foe_shield,
            g.anti_heal_item, g.anti_shield_item,
            /* 行為習慣（好友比較「打法」分頁）：擊殺事件的原始次數與各自的分母，定義就是上面 ke_* 那幾段，不影響分數 */
            t.ke_solo, t.ke_iso_death, t.ke_late_iso_death, t.ke_trade_death, t.ke_late_ka,
            t.kills AS ke_kills, t.deaths AS ke_deaths, t.kills + t.assists AS ke_ka
          FROM gate g LEFT JOIN total t ON t.participant_rowid = g.participant_rowid

    # 與 participants.yml 相同的 refresh key，理由寫在那裡。SQL 必須一字不差才會被合併。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    # 反方向也留一條，讓以這裡為起點的查詢找得到 matches
    joins:
      - name: participants
        sql: "{CUBE}.participant_rowid = {participants}.rowid"
        relationship: one_to_one

    dimensions:
      - name: id
        sql: participant_rowid
        type: number
        primary_key: true
        public: false

      - name: score_status
        title: 貢獻完整度
        description: "本場貢獻的資料完整度：complete（十人都有賽後統計的治療護盾隊友量）、estimate（暫估：沒有賽後統計的護盾量，改以對局治療估算隊友治療；破盾裝不含敵方護盾量）、unscored（不計分：重開、不足 6 分鐘、非大亂鬥或不是完整 5v5）。"
        sql: score_status
        type: string
        meta:
          group: 貢獻

      - name: score_version
        title: 貢獻規則版本
        description: "本場貢獻的規則版本（例如 v5.4）。跨場比較或聚合時要同版本。"
        sql: score_version
        type: string
        meta:
          group: 貢獻

    measures:
      - name: work
        title: 本場貢獻
        description: "本場貢獻（0～100，v5.4 / v5-B 修訂版）。採 100% 跨場絕對尺度（依時長冪次、敵方前排數與對局血腥度 pace_k 校正），不再強制各定位歸 50。核心分依定位權重加總輸出（非輸出定位打出高傷害時享轉型輸出斜率與跨界加成）、承傷（0.62×減免＋0.38×承傷；高輸出時豁免低承傷負分）、擊殺（min(zr_k, zr_d+0.4)，坦／輔高輸出高擊殺解鎖正向加分）、參團（含 65% 時長後參團；輔助 70% 同定位＋30% 全局，並校正敵方前排與血腥度）、治療護盾（暫估局採英雄保人殘差先驗＋輔助裝數量補救並調整不確定性權重；坦輔／控場輔／高傷輔緩衝負向底線）、控場（高輸出時豁免無控場負分）、推塔與清兵（core > 15 後按 1.18 倍拉開）；外加「高光加分（0～+15：多殺與輔助團戰串連、拆塔傷害與單人拆塔、換命＋單殺＋輔助後期保排協同、經濟效率、功能控場等，不含首殺／首塔／終結）」與「失誤扣分（0～-18：純單抓孤立死亡、後期孤死、低存在感隱身）」，最後做全局 EOG／暫估偏移校正（pts_base）。"
        sql: work_score
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: scored_games
        title: 有本場貢獻的場次
        description: "有本場貢獻分數的場數（重開、不足 6 分鐘、不完整的對局沒有分數）。算平均的誤差範圍時，樣本數用這個。"
        sql: "CASE WHEN {CUBE}.work_score IS NOT NULL THEN {CUBE}.participant_rowid END"
        type: count_distinct
        meta:
          group: 貢獻

      - name: top_games
        title: 90 分以上的場次
        description: "本場貢獻 90 分以上的場數（好友比較的「高光時刻」徽章用）。"
        sql: "CASE WHEN {CUBE}.work_score >= 90 THEN {CUBE}.participant_rowid END"
        type: count_distinct
        meta:
          group: 貢獻

      - name: perfect_games
        title: 滿分的場次
        description: "本場貢獻四捨五入到整數後顯示 100 分的場數（好友比較的「滿分演出」徽章用）。"
        sql: "CASE WHEN ROUND({CUBE}.work_score) = 100 THEN {CUBE}.participant_rowid END"
        type: count_distinct
        meta:
          group: 貢獻

      - name: estimate_games
        title: 暫估的場次
        description: "本場貢獻是暫估（score_status = estimate，沒有賽後統計）的場數。"
        sql: "CASE WHEN {CUBE}.score_status = 'estimate' THEN {CUBE}.participant_rowid END"
        type: count_distinct
        meta:
          group: 貢獻

      - name: gene_dmg
        title: 基因・輸出
        description: "經時長冪次校正的每分鐘對英雄傷害，以同出裝定位中位數／IQR 經 spow 標準化（50＝同出裝定位基準）。"
        sql: gene_d
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_soak
        title: 基因・承傷
        description: "經時長校正的有效承傷（0.62×減免＋0.38×承受），以同出裝定位中位數／IQR 經 spow 標準化（50＝同出裝定位基準）。"
        sql: gene_t
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_heal
        title: 基因・治療護盾
        description: "每分鐘治療＋護盾隊友（暫估場次由對局總治療乘 h_scale 估算隊友治療，輔助另依同英雄護盾先驗＋輔助裝數量與參團活躍度估算隊友護盾）相對於輔助基準中位數／IQR 的 spow 分數（50＝輔助基準）。"
        sql: gene_h
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_cc
        title: 基因・控場
        description: "每分鐘控制敵人時間與累計控場時長（0.65×zr_c＋0.35×max(zr_c, zr_ccdur)）相對於同出裝定位基準的分數（50＝基準）。"
        sql: gene_c
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_kill
        title: 基因・擊殺
        description: "每分鐘擊殺數經 spow 標準化相對於同出裝定位基準的分數（50＝基準）。實際核心計分取 min(zr_k, zr_d + 0.4) 防低輸出尾刀灌水。"
        sql: gene_ks
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_ka
        title: 基因・參團
        description: "經時長冪次校正的每分鐘擊殺＋助攻相對於同出裝定位基準的 spow 分數（50＝基準）。核心計分採跨場全局尺度與 65% 時長後參團率。"
        sql: gene_ka
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_kda
        title: 基因・K/DA
        description: "參團率與存活（每分鐘死亡越少越好）各半，供打法「很少死／常陣亡」顯示。"
        sql: gene_kda
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_obj
        title: 基因・推塔
        description: "經時長冪次校正的每分鐘對建築傷害，相對於同出裝定位基準的 spow 分數（50＝基準）。"
        sql: gene_o
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_wave
        title: 基因・清兵
        description: "經時長冪次校正的每分鐘對小兵傷害，相對於同出裝定位基準的 spow 分數（50＝基準）。"
        sql: gene_w
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_anti
        title: 基因・功能裝
        description: "終場帶重創／破盾裝估計擋掉的敵方治療與護盾轉換分數。"
        sql: gene_a
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: pts_dmg
        title: 加減分・輸出
        description: "輸出這一項（含坦輔高輸出額外獎勵）讓本場貢獻加減幾分。"
        sql: pts_d
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_soak
        title: 加減分・承傷
        description: "承傷這一項讓本場貢獻加減幾分。"
        sql: pts_t
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_heal
        title: 加減分・治療護盾
        description: "治療護盾這一項（含非輔輸出位順手補血獎勵）讓本場貢獻加減幾分。"
        sql: pts_h
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_cc
        title: 加減分・控場
        description: "控場這一項（含輸出／鬥士高控場獎勵）讓本場貢獻加減幾分。"
        sql: pts_c
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_kill
        title: 加減分・擊殺
        description: "擊殺這一項（與輸出上限連動）讓本場貢獻加減幾分。"
        sql: pts_ks
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_ka
        title: 加減分・參團
        description: "參團率與 65% 時長後後期參團讓本場貢獻加減幾分。"
        sql: pts_ka
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_bonus
        title: 加減分・高光加分
        description: "多殺、拆塔傷害與單人拆塔、換命＋單殺與經濟效率帶來的高光加分（≥ 0，不含首殺、首塔與終結）。"
        sql: pts_bonus
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_penalty
        title: 加減分・失誤扣分
        description: "純單抓孤立死亡（±10 秒內友方無擊殺且無其他友軍死亡）、65% 後後期孤死與極低存在感隱身造成的扣分（≤ 0）。"
        sql: pts_penalty
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_base
        title: 加減分・整體校正
        description: "僅依 EOG／暫估資料來源固定的全局基準偏移：全部加減分（含高光／失誤）加上它即等於本場貢獻 − 50（夾 0～100 之前）。"
        sql: pts_base
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_kda
        title: 加減分・K/DA
        description: "不單獨計分（死亡細節已移至失誤扣分），一律是 0（欄位保留相容舊查詢）。"
        sql: "0.0"
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_obj
        title: 加減分・推塔
        description: "推塔這一項讓本場貢獻加減幾分。"
        sql: pts_o
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_wave
        title: 加減分・清兵
        description: "清兵這一項讓本場貢獻加減幾分。"
        sql: pts_w
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_anti
        title: 加減分・功能裝
        description: "功能裝這一項讓本場貢獻加減幾分。"
        sql: pts_a
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: rel_dmg
        title: 同場比・輸出
        description: "每分鐘對英雄傷害和同一場另外九人的平均比（0～100，等於平均是 50、兩倍約 67），還沒和同出裝定位比。"
        sql: p_d
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: rel_soak
        title: 同場比・承傷
        description: "每分鐘承受＋自身減免和同一場另外九人的平均比（同輸出）。"
        sql: p_t
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: rel_cc
        title: 同場比・控場
        description: "每分鐘控制敵人的時間和同一場另外九人的平均比（同輸出）。"
        sql: p_c
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: rel_kda
        title: 同場比・K/DA
        description: "參團率與存活（死得少）各自和同一場另外九人的平均比，再平均（同輸出）。"
        sql: p_kda
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: rel_obj
        title: 同場比・推塔
        description: "每分鐘對建築的傷害和同一場另外九人的平均比（同輸出）。"
        sql: p_o
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: rel_wave
        title: 同場比・清兵
        description: "每分鐘對小兵的傷害和同一場另外九人的平均比（同輸出）。"
        sql: p_w
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: anti_heal_share
        title: 帶重創裝的比例
        description: "終場持有重創裝（致死宣告、荊棘之甲、刺藤胸甲、死刑宣告、黑魔禁書、遺忘寶珠、生化龐克鏈鋸之劍）的場次比例（%）。"
        sql: "{CUBE}.anti_heal_item * 100.0"
        type: avg
        meta:
          group: 貢獻
          unit: "%"
          decimals: 0

      # ── 行為習慣：擊殺事件（match_kill_events）算出的次數與比例，只描述打法、不另外計分。
      #    比例一律「加總 ÷ 加總」，不是每場比例的平均；只算有本場貢獻的場次（時間軸事件實測全數涵蓋）。
      - name: solo_kills
        title: 單殺次數
        description: "沒有任何隊友助攻的擊殺次數（加總）。"
        sql: ke_solo
        type: sum
        meta:
          group: 習慣

      - name: habit_kills
        title: 擊殺數（習慣分母）
        description: "有本場貢獻的場次的擊殺加總，單殺占比的分母。"
        sql: ke_kills
        type: sum
        meta:
          group: 習慣

      - name: iso_deaths
        title: 被單抓次數
        description: "孤立死亡次數（加總）：死亡前後 10 秒內，我方沒有擊殺、我方也只有自己陣亡。"
        sql: ke_iso_death
        type: sum
        meta:
          group: 習慣

      - name: late_iso_deaths
        title: 後期被單抓次數
        description: "發生在對局最後 35% 時間的孤立死亡次數（加總）。"
        sql: ke_late_iso_death
        type: sum
        meta:
          group: 習慣

      - name: trade_deaths
        title: 有換到的死亡次數
        description: "死亡前後 10 秒內我方拿到 2 個以上擊殺的死亡次數（加總）：死在打贏的團戰裡。"
        sql: ke_trade_death
        type: sum
        meta:
          group: 習慣

      - name: habit_deaths
        title: 死亡數（習慣分母）
        description: "有本場貢獻的場次的死亡加總，被單抓占比、有換到占比的分母。"
        sql: ke_deaths
        type: sum
        meta:
          group: 習慣

      - name: late_ka
        title: 後期擊殺參與次數
        description: "發生在對局最後 35% 時間的擊殺＋助攻次數（加總）。"
        sql: ke_late_ka
        type: sum
        meta:
          group: 習慣

      - name: habit_ka
        title: 擊殺參與數（習慣分母）
        description: "有本場貢獻的場次的擊殺＋助攻加總，後期參與占比的分母。"
        sql: ke_ka
        type: sum
        meta:
          group: 習慣

      - name: solo_kill_share
        title: 單殺占擊殺
        description: "單殺次數 ÷ 擊殺數（%）：他的擊殺有多少是沒有隊友幫忙拿下的。"
        sql: "100.0 * {solo_kills} / NULLIF({habit_kills}, 0)"
        type: number
        meta:
          group: 習慣
          unit: "%"
          decimals: 1

      - name: iso_death_share
        title: 被單抓占死亡
        description: "孤立死亡次數 ÷ 死亡數（%）：他的死亡有多少是落單被抓（前後 10 秒我方沒有擊殺、也沒有其他隊友陣亡）。"
        sql: "100.0 * {iso_deaths} / NULLIF({habit_deaths}, 0)"
        type: number
        meta:
          group: 習慣
          unit: "%"
          decimals: 1

      - name: trade_death_share
        title: 有換到占死亡
        description: "有換到的死亡次數 ÷ 死亡數（%）：他的死亡有多少發生在我方同時拿到 2 個以上擊殺的團戰裡。"
        sql: "100.0 * {trade_deaths} / NULLIF({habit_deaths}, 0)"
        type: number
        meta:
          group: 習慣
          unit: "%"
          decimals: 1

      - name: late_ka_share
        title: 後期參與占比
        description: "後期擊殺參與次數 ÷ 擊殺參與數（%）：他的擊殺＋助攻有多少發生在對局最後 35% 的時間。"
        sql: "100.0 * {late_ka} / NULLIF({habit_ka}, 0)"
        type: number
        meta:
          group: 習慣
          unit: "%"
          decimals: 1
