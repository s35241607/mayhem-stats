      - name: pts_obj
        title: 加減分・推塔
        description: "推塔這一項讓本場貢獻加減幾分。"
        sql: pts_o
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_wave
        title: 加減分・清兵
        description: "清兵這一項讓本場貢獻加減幾分。"
        sql: pts_w
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_anti
        title: 加減分・功能裝
        description: "功能裝這一項讓本場貢獻加減幾分。"
        sql: pts_a
