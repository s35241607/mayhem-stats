cubes:
  # 本場貢獻（work_score）：全站唯一的分數。計分板大數字、對局卡片、MVP／ACE、英雄頁、好友比較頁（含「打法」）都用它。
  # 規格與實測依據見 docs/contribution-scoring.md；基因的實測與組合比較在 analysis/scoring_v3_genes.py。
  #
  # 規則版本 v3.1（2026-10-24）。改下面任何一個常數、權重或公式，都要把 score_version 往上升，並重跑
  # analysis/scoring_v3_fit.py（重新產生校正常數）與 analysis/scoring_v3_check.py（獨立 Python 逐筆比對）。
  #   v3.0 取代 v2.3（contribution_v2.yml）與更早的 perf／score。使用者 2026-10-24 的要求：計分方式統一，
  #   拆成「基因」逐項算；不要再依定位挑項目（v2 依裝備決定哪幾項算分，全防禦裝卻打出全場最高輸出的坦克只拿 27 分），
  #   坦克輸出高就該高分；承傷要含自身減免；K/DA、功能裝也要算。
  #   v3.0 → v3.1：K/DA 的「擊殺參與」從每分鐘擊殺＋助攻改成參團率（擊殺＋助攻 ÷ 我方擊殺）。回放：和勝負的相關 0.265 → 0.227（比較不像在算誰贏）、
  #   個人 η² 0.118 → 0.124（更分得出人）；依據見 analysis/scoring-v3-review-2026-10-24.md。校正常數一併重新產生。
  #
  # 1. 計分範圍：queue 2400、非重開、≥ 360 秒、雙方各 5 人。其他場次留一列但分數是空值，unscored_reason 寫原因。
  # 2. 八個基因，每分鐘的量（本場十人時長相同）：
  #      D 對英雄輸出、W 對小兵傷害（總輸出 − 對英雄 − 對建築；大亂鬥沒有野怪）、O 對建築傷害、
  #      T 承傷（承受＋自身減免）、C 控場（time_ccing_others）、H 治療＋護盾隊友、
  #      A 功能裝：終場帶重創裝擋掉的敵方治療（敵方全隊每分鐘治療 × 40% ÷ 我方帶重創的人數）＋帶破盾裝擋掉的敵方護盾（同算法，只有賽後統計有護盾量），
  #      KDA：參團率（擊殺＋助攻 ÷ 我方擊殺，我方 0 殺時是 0）與存活（死亡少）各半。
  # 3. 每個基因先和同一場的人比，換成 0～100（rel_*）：
  #      D、W、O、T、C、參團率：P = 100 × x ÷ (x + E)，E＝其他九人的平均；等於平均是 50、兩倍約 67。x = 0 → 0；其他九人都是 0 → 100。
  #      存活：P = 100 × E ÷ (死亡 + E)（死得比別人少就高），沒死 → 100。KDA＝(P_K + P_存活) ÷ 2。
  #      H、A：同場常只有一兩個人有量，相對分會變成「量多量少同分」，改成固定換算 100 × x ÷ (x + K)：
  #        H 有賽後統計（十人都有）K＝1250，沒有的場次退回含自補的治療量（units_healed ≥ 2 的人才算）K＝1100，標暫估；A 的 K＝630（帶功能裝的人的中位數）。
  # 4. 和同出裝定位比（builds.yml 的 build_role：射手、法師、刺客、鬥士、坦克、輔助；未成形用全體平均）：
  #      z = (P − 同出裝定位的平均) ÷ 該基因的標準差。每個人八個基因都算，沒有「這個定位只看哪幾項」——
  #      坦克打出高輸出，輸出那一項就比坦克平常高很多，直接加分。H 依資料來源（eog／flag）各有一組平均與標準差。
  #      基因分數 gene_* = 50 + 20 × z（夾在 0～100）：50＝同出裝定位的人在一場裡的平均。
  # 5. 總分：raw = 0.25 D + 0.20 T + 0.13 H + 0.12 C + 0.12 KDA + 0.08 O + 0.06 W + 0.04 A（各基因的 z），
  #      work_score = 50 + 20 × raw ÷ SD（夾在 0～100）。pts_* 是每個基因讓總分加減幾分（20 × 權重 × z ÷ SD），加起來＝總分 − 50（夾之前）。
  #      權重怎麼定的見 docs/contribution-scoring.md：隊伍層級「兩隊差距 → 勝負」的迴歸會把 78% 給推塔（拆塔就是贏，是結果），不能直接用；
  #      所以輸出、承傷、治療、控場這些「工作」占大部分，K/DA 與推塔這種和勝負綁很緊的只給一點，功能裝看不出讓勝率變高、給最少。
  # 6. 校正常數（各出裝定位的平均、各基因的標準差、總分的 SD）是 v3.1 定版時（2026-10-24，852 場）算出來寫死的：
  #      之後新增對局不會改舊分。所以 50 是「定版當時、同出裝定位的人的平均」，不是同英雄的中位數。
  #
  # 限制（畫面與說明要講清楚）：這是本場相對工作量，不是操作實力；同樣的數值在不同陣容下會不同分；承傷分不出有效開戰與無效吃傷；
  # K/DA、推塔有一半是結果（贏的隊殺得多、拆得到塔）；功能裝只看終場有沒有帶，不知道實際命中多少；跨場平均只能當描述。
  - name: contribution
    title: 本場貢獻
    # 規則本體在 meta.materialize.sql，每次入庫後由 features.py 重建 mat_contribution。改完重啟服務或 `uv run features.py`。
    # 用 | 而不是 >：SQL 裡有 -- 註解。
    sql_table: mat_contribution
    meta:
      materialize:
        table: mat_contribution
        sql: |
          WITH items AS (
            -- 功能裝（只看終場 slot 0–5）：重創＝致死宣告、荊棘之甲、刺藤胸甲、死刑宣告、黑魔禁書、遺忘寶珠、生化龐克鏈鋸之劍（含其他模式的同名版本）；
            -- 破盾＝巨蛇鋒牙。觸發條件不同（受到普攻／造成魔法傷害／造成物理傷害），這一版不判斷
            SELECT pi.platform_id, pi.game_id, pi.participant_id,
              MAX(pi.item_id IN (3033, 3075, 3076, 3123, 3165, 3916, 6609, 223033, 223075, 223165, 226609, 323075, 773075, 773123, 773165)) AS anti_heal_item,
              MAX(pi.item_id IN (6695, 226695)) AS anti_shield_item
            FROM participant_items pi
            WHERE pi.slot < 6 AND pi.item_id > 0
            GROUP BY 1, 2, 3
          ),
          base AS (
            SELECT mp.rowid AS participant_rowid, mp.platform_id, mp.game_id, mp.team_id, m.queue_id, m.is_remake, m.game_duration,
              COALESCE(b.build_role, '未成形') AS build_role,
              mp.dmg_to_champions * 60.0 / m.game_duration AS x_d,
              MAX(0, mp.total_damage - mp.dmg_to_champions - mp.dmg_to_objectives) * 60.0 / m.game_duration AS x_w,
              mp.dmg_to_objectives * 60.0 / m.game_duration AS x_o,
              (mp.dmg_taken + mp.dmg_mitigated) * 60.0 / m.game_duration AS x_t,
              mp.time_ccing_others * 60.0 / m.game_duration AS x_c,
              mp.kills, mp.assists,
              mp.deaths * 60.0 / m.game_duration AS x_death,
              mp.total_heal * 60.0 / m.game_duration AS heal_all,
              (e.heal_on_teammates + e.shield_on_teammates) * 60.0 / m.game_duration AS h_eog,
              e.shield_on_teammates * 60.0 / m.game_duration AS shield_eog,
              CASE WHEN mp.units_healed >= 2 THEN mp.total_heal * 60.0 / m.game_duration
                   WHEN mp.units_healed IS NOT NULL THEN 0.0 END AS h_flag,
              COALESCE(i.anti_heal_item, 0) AS anti_heal_item, COALESCE(i.anti_shield_item, 0) AS anti_shield_item
            FROM match_participants mp
            JOIN matches m ON m.platform_id = mp.platform_id AND m.game_id = mp.game_id
            LEFT JOIN mat_builds b ON b.participant_rowid = mp.rowid
            LEFT JOIN items i ON i.platform_id = mp.platform_id AND i.game_id = mp.game_id AND i.participant_id = mp.participant_id
            LEFT JOIN eog_player_stats e ON e.game_id = mp.game_id AND e.puuid = mp.puuid
          ),
          gate AS (
            SELECT *,
              CASE WHEN queue_id <> 2400 THEN 'other_queue'
                   WHEN is_remake = 1 OR game_duration < 360 THEN 'remake_or_short_game'
                   WHEN COUNT(*) OVER g <> 10 OR SUM(team_id = 100) OVER g <> 5 THEN 'incomplete_5v5'
                   WHEN COUNT(x_d) OVER g < 10 OR COUNT(x_t) OVER g < 10 OR COUNT(x_c) OVER g < 10 OR COUNT(x_w) OVER g < 10
                     OR COUNT(x_o) OVER g < 10 OR COUNT(kills) OVER g < 10 OR COUNT(assists) OVER g < 10 OR COUNT(x_death) OVER g < 10 OR COUNT(heal_all) OVER g < 10 THEN 'missing_main_axis'
              END AS unscored_reason,
              -- 本場十人都有賽後統計才用 eog，否則整場退回 flag（不混用：缺的人不能當 0）
              CASE WHEN COUNT(h_eog) OVER g = 10 THEN 'eog' WHEN COUNT(h_flag) OVER g = 10 THEN 'flag' END AS heal_src
            FROM base
            WINDOW g AS (PARTITION BY platform_id, game_id)
          ),
          team AS (
            SELECT *,
              CASE heal_src WHEN 'eog' THEN h_eog ELSE h_flag END AS x_h,
              -- 敵方＝整場減掉我方
              SUM(heal_all) OVER g - SUM(heal_all) OVER t AS foe_heal,
              CASE WHEN heal_src = 'eog' THEN SUM(shield_eog) OVER g - SUM(shield_eog) OVER t ELSE 0.0 END AS foe_shield,
              SUM(anti_heal_item) OVER t AS team_anti_heal, SUM(anti_shield_item) OVER t AS team_anti_shield,
              -- 參團率：擊殺＋助攻 ÷ 我方擊殺
              CASE WHEN SUM(kills) OVER t = 0 THEN 0.0 ELSE (kills + assists) * 1.0 / SUM(kills) OVER t END AS x_kp
            FROM gate
            WHERE unscored_reason IS NULL AND heal_src IS NOT NULL
            WINDOW g AS (PARTITION BY platform_id, game_id), t AS (PARTITION BY platform_id, game_id, team_id)
          ),
          genes AS (
            SELECT *,
              -- 重創 40%、破盾也取 40%（巨蛇鋒牙近戰 50%、遠程 35%）；同隊多人帶不疊加，平分
              CASE WHEN anti_heal_item = 1 THEN 0.4 * foe_heal / team_anti_heal ELSE 0.0 END
                + CASE WHEN anti_shield_item = 1 THEN 0.4 * foe_shield / team_anti_shield ELSE 0.0 END AS x_a,
              (SUM(x_d) OVER g - x_d) / 9.0 AS e_d, (SUM(x_w) OVER g - x_w) / 9.0 AS e_w, (SUM(x_o) OVER g - x_o) / 9.0 AS e_o,
              (SUM(x_t) OVER g - x_t) / 9.0 AS e_t, (SUM(x_c) OVER g - x_c) / 9.0 AS e_c, (SUM(x_kp) OVER g - x_kp) / 9.0 AS e_k,
              (SUM(x_death) OVER g - x_death) / 9.0 AS e_death
            FROM team
            WINDOW g AS (PARTITION BY platform_id, game_id)
          ),
          parts AS (
            SELECT *,
              CASE WHEN x_d = 0 THEN 0.0 WHEN e_d = 0 THEN 100.0 ELSE 100.0 * x_d / (x_d + e_d) END AS p_d,
              CASE WHEN x_w = 0 THEN 0.0 WHEN e_w = 0 THEN 100.0 ELSE 100.0 * x_w / (x_w + e_w) END AS p_w,
              CASE WHEN x_o = 0 THEN 0.0 WHEN e_o = 0 THEN 100.0 ELSE 100.0 * x_o / (x_o + e_o) END AS p_o,
              CASE WHEN x_t = 0 THEN 0.0 WHEN e_t = 0 THEN 100.0 ELSE 100.0 * x_t / (x_t + e_t) END AS p_t,
              CASE WHEN x_c = 0 THEN 0.0 WHEN e_c = 0 THEN 100.0 ELSE 100.0 * x_c / (x_c + e_c) END AS p_c,
              CASE WHEN x_kp = 0 THEN 0.0 WHEN e_k = 0 THEN 100.0 ELSE 100.0 * x_kp / (x_kp + e_k) END AS p_k,
              CASE WHEN x_death = 0 THEN 100.0 WHEN e_death = 0 THEN 0.0 ELSE 100.0 * e_death / (x_death + e_death) END AS p_s,
              100.0 * x_h / (x_h + CASE heal_src WHEN 'eog' THEN 1250.0 ELSE 1100.0 END) AS p_h,
              100.0 * x_a / (x_a + 630.0) AS p_a
            FROM genes
          ),
          calib(build_role, mu_d, mu_w, mu_o, mu_t, mu_c, mu_h_eog, mu_h_flag, mu_a, mu_kda) AS (
            -- 校正常數開始（analysis/scoring_v3_fit.py 產生，v3.1 定版時 2026-10-24 的資料；寫死，新增對局不會改舊分）
            VALUES
              ('射手', 52.138, 57.383, 50.593, 36.869, 26.621, 1.764, 4.216, 8.431, 49.992),
              ('法師', 49.920, 48.811, 37.241, 38.201, 51.316, 2.657, 3.263, 9.182, 51.297),
              ('刺客', 51.164, 43.078, 38.532, 45.461, 33.036, 0.695, 2.230, 5.792, 48.805),
              ('鬥士', 49.244, 48.574, 39.322, 52.717, 44.067, 1.596, 1.740, 9.569, 48.939),
              ('坦克', 41.528, 33.254, 26.851, 66.965, 57.365, 4.967, 4.435, 18.622, 50.543),
              ('輔助', 25.956, 20.446, 27.625, 35.436, 51.618, 45.452, 46.607, 5.043, 57.089),
              ('未成形', 48.241, 46.344, 38.421, 46.574, 43.878, 3.903, 4.508, 10.016, 50.274)
          ),
          sd(sd_d, sd_w, sd_o, sd_t, sd_c, sd_h_eog, sd_h_flag, sd_a, sd_kda, sd_work) AS (
            VALUES (9.292, 12.789, 25.541, 9.135, 17.749, 17.493, 18.190, 20.597, 4.477, 0.4410)
            -- 校正常數結束
          ),
          z AS (
            SELECT p.*, (p.p_k + p.p_s) / 2 AS p_kda,
              (p.p_d - k.mu_d) / s.sd_d AS z_d,
              (p.p_w - k.mu_w) / s.sd_w AS z_w,
              (p.p_o - k.mu_o) / s.sd_o AS z_o,
              (p.p_t - k.mu_t) / s.sd_t AS z_t,
              (p.p_c - k.mu_c) / s.sd_c AS z_c,
              CASE p.heal_src WHEN 'eog' THEN (p.p_h - k.mu_h_eog) / s.sd_h_eog ELSE (p.p_h - k.mu_h_flag) / s.sd_h_flag END AS z_h,
              (p.p_a - k.mu_a) / s.sd_a AS z_a,
              ((p.p_k + p.p_s) / 2 - k.mu_kda) / s.sd_kda AS z_kda,
              s.sd_work
            FROM parts p JOIN calib k ON k.build_role = p.build_role CROSS JOIN sd s
          ),
          total AS (
            -- 第 5 步的權重（加起來 1）
            SELECT *,
              0.25 * z_d + 0.20 * z_t + 0.13 * z_h + 0.12 * z_c + 0.12 * z_kda + 0.08 * z_o + 0.06 * z_w + 0.04 * z_a AS work_raw
            FROM z
          )
          SELECT g.participant_rowid, 'v3.1' AS score_version,
            CASE WHEN g.unscored_reason IS NOT NULL OR g.heal_src IS NULL THEN 'unscored'
                 WHEN t.heal_src = 'eog' THEN 'complete' ELSE 'estimate' END AS score_status,
            COALESCE(g.unscored_reason, CASE WHEN g.heal_src IS NULL THEN 'missing_heal_data' END) AS unscored_reason,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.work_raw / t.sd_work)), 9) AS work_score,
            ROUND(t.work_raw, 9) AS work_raw, g.build_role, t.heal_src,
            -- 基因分數（50＝同出裝定位的平均）
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.z_d)), 9) AS gene_d, ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.z_w)), 9) AS gene_w,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.z_o)), 9) AS gene_o, ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.z_t)), 9) AS gene_t,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.z_c)), 9) AS gene_c, ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.z_h)), 9) AS gene_h,
            ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.z_a)), 9) AS gene_a, ROUND(MIN(100.0, MAX(0.0, 50.0 + 20.0 * t.z_kda)), 9) AS gene_kda,
            -- 每個基因讓總分加減幾分（夾在 0～100 之前，加起來＝總分 − 50）
            ROUND(20.0 * 0.25 * t.z_d / t.sd_work, 9) AS pts_d, ROUND(20.0 * 0.06 * t.z_w / t.sd_work, 9) AS pts_w,
            ROUND(20.0 * 0.08 * t.z_o / t.sd_work, 9) AS pts_o, ROUND(20.0 * 0.20 * t.z_t / t.sd_work, 9) AS pts_t,
            ROUND(20.0 * 0.12 * t.z_c / t.sd_work, 9) AS pts_c, ROUND(20.0 * 0.13 * t.z_h / t.sd_work, 9) AS pts_h,
            ROUND(20.0 * 0.04 * t.z_a / t.sd_work, 9) AS pts_a, ROUND(20.0 * 0.12 * t.z_kda / t.sd_work, 9) AS pts_kda,
            -- 和同一場的人比（第 3 步）
            t.p_d, t.p_w, t.p_o, t.p_t, t.p_c, t.p_h, t.p_a, t.p_k, t.p_s, t.p_kda,
            t.x_d, t.x_w, t.x_o, t.x_t, t.x_c, t.x_h, t.x_a, t.x_kp, t.x_death, t.foe_heal, t.foe_shield,
            g.anti_heal_item, g.anti_shield_item
          FROM gate g LEFT JOIN total t ON t.participant_rowid = g.participant_rowid

    # 與 participants.yml 相同的 refresh key，理由寫在那裡。SQL 必須一字不差才會被合併。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    # 反方向也留一條，讓以這裡為起點的查詢找得到 matches
    joins:
      - name: participants
        sql: "{CUBE}.participant_rowid = {participants}.rowid"
        relationship: one_to_one

    dimensions:
      - name: id
        sql: participant_rowid
        type: number
        primary_key: true
        public: false

      - name: score_status
        title: 貢獻完整度
        description: "本場貢獻的資料完整度：complete（十人都有賽後統計的治療護盾隊友量）、estimate（暫估：沒有賽後統計，治療護盾改用含自補的治療量，破盾裝沒有敵方護盾量）、unscored（不計分：重開、不足 6 分鐘、非大亂鬥或不是完整 5v5）。"
        sql: score_status
        type: string
        meta:
          group: 貢獻

      - name: score_version
        title: 貢獻規則版本
        description: "本場貢獻的規則版本（例如 v3.1）。跨場比較或聚合時要同版本。"
        sql: score_version
        type: string
        meta:
          group: 貢獻

    measures:
      - name: work
        title: 本場貢獻
        description: "本場貢獻（0～100）：八個基因（對英雄輸出、承傷＝承受＋自身減免、治療護盾隊友、控場、K/DA、對建築傷害、對小兵傷害、功能裝擋掉的敵方治療護盾）先各自和同一場的人比，再和同出裝定位的平均比，最後加權（輸出 25%、承傷 20%、治療護盾 13%、控場 12%、K/DA 12%、推塔 8%、清兵 6%、功能裝 4%）。每個人八項都算，坦克打出高輸出一樣加分。50＝同出裝定位的人的平均（校正常數在 v3.0 定版時寫死）。沒有賽後統計的場次是暫估（score_status）。跨場平均只是描述，不代表操作實力。"
        sql: work_score
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: scored_games
        title: 有本場貢獻的場次
        description: "有本場貢獻分數的場數（重開、不足 6 分鐘、不完整的對局沒有分數）。算平均的誤差範圍時，樣本數用這個。"
        sql: "CASE WHEN {CUBE}.work_score IS NOT NULL THEN {CUBE}.participant_rowid END"
        type: count_distinct
        meta:
          group: 貢獻

      - name: top_games
        title: 90 分以上的場次
        description: "本場貢獻 90 分以上的場數（好友比較的「高光時刻」徽章用）。"
        sql: "CASE WHEN {CUBE}.work_score >= 90 THEN {CUBE}.participant_rowid END"
        type: count_distinct
        meta:
          group: 貢獻

      - name: perfect_games
        title: 滿分的場次
        description: "本場貢獻 100 分（量尺頂端）的場數（好友比較的「滿分演出」徽章用）。"
        sql: "CASE WHEN {CUBE}.work_score >= 100 THEN {CUBE}.participant_rowid END"
        type: count_distinct
        meta:
          group: 貢獻

      - name: estimate_games
        title: 暫估的場次
        description: "本場貢獻是暫估（score_status = estimate，沒有賽後統計）的場數。"
        sql: "CASE WHEN {CUBE}.score_status = 'estimate' THEN {CUBE}.participant_rowid END"
        type: count_distinct
        meta:
          group: 貢獻

      - name: gene_dmg
        title: 基因・輸出
        description: "每分鐘對英雄傷害：先和同一場另外九人的平均比，再和同出裝定位的人平常的比法比。50＝同出裝定位的平均，每 20 分是一個標準差。占總分 25%。"
        sql: gene_d
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_soak
        title: 基因・承傷
        description: "每分鐘承受＋自身減免（護甲、魔抗、護盾擋下的都算）的傷害，比法同輸出。分不出有效開戰或無效吃傷。占總分 20%。"
        sql: gene_t
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_heal
        title: 基因・治療護盾
        description: "每分鐘治療＋護盾隊友（固定換算：每分鐘 1250 是 50 分的量），再和同出裝定位的平均比。沒有賽後統計的場次改用含自補的治療量（只算有治療到隊友的人），是暫估。占總分 13%。"
        sql: gene_h
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_cc
        title: 基因・控場
        description: "每分鐘控制敵人的時間（time_ccing_others），比法同輸出。占總分 12%。"
        sql: gene_c
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_kda
        title: 基因・K/DA
        description: "參團率（擊殺＋助攻 ÷ 我方擊殺）與存活（每分鐘死亡越少越好）各半，比法同輸出。死亡有一半是結果（輸的隊死得多），所以只占總分 12%。"
        sql: gene_kda
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_obj
        title: 基因・推塔
        description: "每分鐘對建築的傷害，比法同輸出。和勝負綁得最緊（拆塔就是贏），所以只占總分 8%。"
        sql: gene_o
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_wave
        title: 基因・清兵
        description: "每分鐘對小兵的傷害（總輸出 − 對英雄 − 對建築；大亂鬥沒有野怪），比法同輸出。占總分 6%。"
        sql: gene_w
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: gene_anti
        title: 基因・功能裝
        description: "終場帶重創裝擋掉的敵方治療（敵方全隊治療 × 40% ÷ 我方帶重創的人數）＋帶破盾裝擋掉的敵方護盾（只有賽後統計有），換成 0～100 後和同出裝定位的平均比。只看有沒有帶，不知道實際命中多少；資料看不出帶了勝率比較高，所以只占總分 4%。"
        sql: gene_a
        type: avg
        meta:
          group: 貢獻
          decimals: 0
          higherIsBetter: true

      - name: pts_dmg
        title: 加減分・輸出
        description: "輸出這一項讓本場貢獻加減幾分（正的是加分）。八項加起來＝本場貢獻 − 50（夾在 0～100 之前）。"
        sql: pts_d
        type: avg
        meta:
          group: 貢獻
          decimals: 1

      - name: pts_soak
        title: 加減分・承傷
