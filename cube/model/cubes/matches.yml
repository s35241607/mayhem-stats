cubes:
  - name: matches
    sql_table: matches
    description: 一場對局的表頭。時間欄位在資料庫裡是 epoch 毫秒(UTC),這裡轉成時間戳給 Cube,時區換算交由查詢端指定。

    # 與 participants.yml 相同的 refresh key,理由寫在那裡。SQL 必須一字不差才會被合併。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts)

    dimensions:
      - name: id
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id"
        type: string
        primary_key: true

      - name: game_id
        sql: game_id
        type: number

      - name: queue_id
        title: 模式代號
        sql: queue_id
        type: number
        description: 2400 = ARAM Mayhem
        meta:
          group: 對局

      - name: game_mode
        title: 遊戲模式
        sql: game_mode
        type: string
        meta:
          group: 對局

      - name: patch
        sql: "substr({CUBE}.game_version, 1, instr({CUBE}.game_version, '.') - 1) || '.' || substr(substr({CUBE}.game_version, instr({CUBE}.game_version, '.') + 1), 1, instr(substr({CUBE}.game_version, instr({CUBE}.game_version, '.') + 1), '.') - 1)"
        type: string
        title: 遊戲版本
        description: 只取主版號.次版號,例如 16.17
        meta:
          group: 時間

      - name: played_at
        title: 對局時間
        sql: "datetime({CUBE}.game_creation / 1000, 'unixepoch')"
        type: time
        meta:
          group: 時間

      # 「幾點」「星期幾」是從時間戳抽取出來的，不是 Cube 的時間粒度，所以另外定義。
      # 型別刻意用字串:這些是運算式、沒有欄位型別親和性,而 Cube 會把篩選值綁成
      # 字串,若宣告成數字,SQLite 不會把 '15' 轉成 15,篩選會永遠比對不到。
      # 這裡的 localtime 取本機時區——這個工具本來就跑在使用者自己的電腦上。
      # 這三個是採集時就用 Python 算好存進資料庫的本地時間。
      # 不要改回 strftime(..., 'localtime'):Cube 的 server 行程跑在 UTC 下,
      # 那個 'localtime' 等於 UTC,整頁時段分析會偏移 8 小時。
      # (實測過:畫面說「最常打 週日 07:00」,實際是週日 15:00。)
      - name: hour_of_day
        title: 時段
        sql: local_hour
        type: number
        meta:
          group: 時間

      - name: weekday
        title: 星期
        sql: local_weekday
        type: number
        description: 0 = 週日
        meta:
          group: 時間

      - name: local_date
        title: 日期
        sql: local_date
        type: string
        description: 開打當下的本地日期(YYYY-MM-DD)
        meta:
          group: 時間

      - name: duration_minutes
        sql: "{CUBE}.game_duration / 60.0"
        type: number

      - name: duration_bucket
        title: 對局長度
        meta:
          group: 對局
        sql: >
          CASE WHEN {CUBE}.game_duration < 900 THEN '< 15 分'
               WHEN {CUBE}.game_duration < 1200 THEN '15-20 分'
               WHEN {CUBE}.game_duration < 1500 THEN '20-25 分'
               ELSE '25 分以上' END
        type: string

      - name: ended_surrender
        sql: ended_surrender
        type: number

    measures:
      - name: count
        type: count
        public: false

      - name: avg_duration
        title: 平均對局時長
        sql: "{CUBE}.game_duration / 60.0"
        type: avg
        meta:
          group: 對局
          unit: 分
          decimals: 1
