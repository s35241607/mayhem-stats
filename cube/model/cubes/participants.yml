cubes:
  - name: participants
    title: 對局表現
    sql_table: match_participants
    description: >
      主要事實表:每場對局每位玩家一列。以增幅或裝備為維度查詢時一場會展開成多列,
      因此所有場次類指標一律用 count_distinct(對局鍵),不能用 count。

    # 快取失效的依據:只有「採集到新對局」或「帳號/追蹤狀態改變」時,
    # 查詢結果才會改變,所以 refresh key 就看這兩樣(外加增幅數量,改版新增增幅時會變)。
    #
    # 沒設的話 Cube 用 FLOOR(UNIX_TIMESTAMP() / 10)——每 10 秒換一次鍵。實測結果是:
    #   - 資料沒變,同一個英雄查詢一天被重跑 44 次,每次背景刷新都佔掉並行度 2 的一個位子
    #   - 查詢在佇列裡等超過 10 秒,鍵就換了,Cube 會把它再跑一次(看過一個請求跑了兩遍、共 27 秒)
    #   - 塞車 -> 鍵過期 -> 重跑 -> 更塞車,是正回饋
    # 所有 cube 都用「一模一樣」的 SQL,Cube 才會把同一時間的檢查合併成一次。
    #
    # 已知漏網:改版只改了名稱、增幅數量不變、又剛好沒有新對局時,舊名稱會
    # 多顯示到下一場入庫為止。只影響顯示,不影響數字。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts)

    joins:
      - name: matches
        sql: "{CUBE}.platform_id = {matches}.platform_id AND {CUBE}.game_id = {matches}.game_id"
        relationship: many_to_one

      - name: champions
        sql: "{CUBE}.champion_id = {champions}.id"
        relationship: many_to_one

      - name: augments
        sql: "{CUBE}.platform_id = {augments}.platform_id AND {CUBE}.game_id = {augments}.game_id AND {CUBE}.participant_id = {augments}.participant_id"
        relationship: one_to_many

      - name: items
        sql: "{CUBE}.platform_id = {items}.platform_id AND {CUBE}.game_id = {items}.game_id AND {CUBE}.participant_id = {items}.participant_id"
        relationship: one_to_many

    # 具名的可重用篩選。定義一次，前端只要送 segment 名稱，
    # 不必自己拼條件——條件的正確性留在模型裡。
    segments:
      - name: wins_only
        title: 只看勝場
        sql: "{CUBE}.win = 1"

      - name: losses_only
        title: 只看敗場
        sql: "{CUBE}.win = 0"

      - name: carried
        title: 我是輸出核心
        sql: "{CUBE}.dmg_to_champions * 1.0 / NULLIF({CUBE}.team_dmg, 0) >= 0.28"

      - name: tanked
        title: 我在扛傷害
        sql: "{CUBE}.dmg_taken * 1.0 / NULLIF({CUBE}.game_duration, 0) >= 45"

      - name: fed
        title: 死超過十次
        sql: "{CUBE}.deaths > 10"

      - name: had_multikill
        title: 有拿到多殺
        sql: "{CUBE}.double_kills + {CUBE}.triple_kills + {CUBE}.quadra_kills + {CUBE}.penta_kills > 0"

    dimensions:
      # 用 SQLite 內建的 rowid,不要用三個欄位串接的字串。
      # 以增幅或裝備為維度、又同時要兩個以上指標時,Cube 會產生一段
      # 「把主鍵撈出來再 join 回本表」的 SQL;主鍵若是字串運算式,
      # 那個 join 就用不到任何索引,實測 4156 x 1101 筆要跑 605 毫秒,
      # 換成 rowid 之後是 11 毫秒。rowid 只在單次查詢內用來把列對回自己,
      # 不會被寫進任何地方,所以 VACUUM 之後改變也沒有影響。
      - name: id
        sql: "{CUBE}.rowid"
        type: number
        primary_key: true
        public: false

      - name: game_key
        title: 對局鍵
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id"
        type: string
        public: false

      - name: puuid
        title: 玩家 ID
        sql: puuid
        type: string
        public: false

      - name: riot_id
        title: 玩家
        sql: riot_id
        type: string
        meta:
          group: 玩家

      # 刻意用字串而不是數字:Cube 會把篩選值綁成字串,而這是 CASE 運算式、
      # 沒有欄位型別親和性,SQLite 不會把 '1' 轉成 1,比較永遠為假。
      # 真欄位(如 queue_id)有 INTEGER 親和性所以不受影響。
      - name: is_me
        title: 是否為本機帳號
        sql: "CASE WHEN {CUBE}.puuid IN (SELECT puuid FROM accounts WHERE is_me = 1) THEN 'true' ELSE 'false' END"
        type: string
        public: false

      - name: champion_id
        sql: champion_id
        type: number
        public: false

      - name: team_id
        sql: team_id
        type: number
        public: false

      - name: team_side
        title: 隊伍
        sql: "CASE WHEN {CUBE}.team_id = 100 THEN '藍隊' ELSE '紅隊' END"
        type: string
        meta:
          group: 對局

      - name: win
        sql: win
        type: number
        public: false

      - name: result
        title: 勝負
        sql: "CASE WHEN {CUBE}.win = 1 THEN '勝' ELSE '敗' END"
        type: string
        meta:
          group: 對局

      - name: champ_level
        title: 結束等級
        sql: champ_level
        type: number
        meta:
          group: 對局

      - name: death_bucket
        title: 死亡數級距
        sql: >
          CASE WHEN {CUBE}.deaths <= 5 THEN '0-5 次'
               WHEN {CUBE}.deaths <= 10 THEN '6-10 次'
               WHEN {CUBE}.deaths <= 15 THEN '11-15 次'
               ELSE '16 次以上' END
        type: string
        meta:
          group: 對局

    measures:
      - name: games
        title: 場次
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id"
        type: count_distinct
        description: 對局數。用 distinct 是因為增幅/裝備維度會讓同一場展開成多列。
        meta:
          group: 基本
          decimals: 0

      - name: wins
        title: 勝場
        sql: "CASE WHEN {CUBE}.win = 1 THEN {CUBE}.platform_id || ':' || {CUBE}.game_id END"
        type: count_distinct
        meta:
          group: 基本
          decimals: 0

      - name: losses
        title: 敗場
        sql: "CASE WHEN {CUBE}.win = 0 THEN {CUBE}.platform_id || ':' || {CUBE}.game_id END"
        type: count_distinct
        meta:
          group: 基本
          decimals: 0

      - name: winrate
        title: 勝率
        sql: "100.0 * {wins} / NULLIF({games}, 0)"
        type: number
        format: percent
        meta:
          group: 基本
          unit: "%"
          decimals: 1
          higherIsBetter: true

      - name: avg_kills
        title: 平均擊殺
        sql: kills
        type: avg
        meta:
          group: 戰鬥
          decimals: 1

      - name: avg_deaths
        title: 平均死亡
        sql: deaths
        type: avg
        meta:
          group: 戰鬥
          decimals: 1
          higherIsBetter: false

      - name: avg_assists
        title: 平均助攻
        sql: assists
        type: avg
        meta:
          group: 戰鬥
          decimals: 1

      - name: kda
        title: KDA
        sql: "({avg_kills} + {avg_assists}) / NULLIF({avg_deaths}, 0)"
        type: number
        meta:
          group: 戰鬥
          decimals: 2
          higherIsBetter: true

      - name: kill_participation
        title: 參團率
        sql: "({CUBE}.kills + {CUBE}.assists) * 100.0 / NULLIF({CUBE}.team_kills, 0)"
        type: avg
        format: percent
        meta:
          group: 戰鬥
          unit: "%"
          decimals: 1
          higherIsBetter: true

      - name: multikills
        title: 多殺次數
        sql: "{CUBE}.double_kills + {CUBE}.triple_kills + {CUBE}.quadra_kills + {CUBE}.penta_kills"
        type: sum
        description: 雙殺以上的總次數
        meta:
          group: 戰鬥
          decimals: 0

      - name: pentas
        title: 五殺次數
        sql: penta_kills
        type: sum
        meta:
          group: 戰鬥
          decimals: 0

      - name: multikill_rate
        title: 多殺場次率
        sql: >
          100.0 * COUNT(DISTINCT CASE
            WHEN {CUBE}.double_kills + {CUBE}.triple_kills
               + {CUBE}.quadra_kills + {CUBE}.penta_kills > 0
            THEN {CUBE}.platform_id || ':' || {CUBE}.game_id END)
          / NULLIF({games}, 0)
        type: number
        format: percent
        description: 有拿到多殺的場次佔比
        meta:
          group: 戰鬥
          unit: "%"
          decimals: 1
          higherIsBetter: true

      - name: first_blood_rate
        title: 首殺率
        sql: >
          100.0 * COUNT(DISTINCT CASE WHEN {CUBE}.first_blood = 1
            THEN {CUBE}.platform_id || ':' || {CUBE}.game_id END)
          / NULLIF({games}, 0)
        type: number
        format: percent
        meta:
          group: 戰鬥
          unit: "%"
          decimals: 1

      - name: avg_damage
        title: 平均對英雄傷害
        sql: dmg_to_champions
        type: avg
        meta:
          group: 輸出
          decimals: 0

      - name: dpm
        title: 每分鐘傷害
        sql: "{CUBE}.dmg_to_champions * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        description: 每分鐘對英雄傷害
        meta:
          group: 輸出
          decimals: 0
          higherIsBetter: true

      - name: damage_share
        title: 傷害佔比
        sql: "{CUBE}.dmg_to_champions * 100.0 / NULLIF({CUBE}.team_dmg, 0)"
        type: avg
        format: percent
        meta:
          group: 輸出
          unit: "%"
          decimals: 1
          higherIsBetter: true

      - name: damage_per_gold
        title: 每塊錢傷害
        sql: "{CUBE}.dmg_to_champions * 1.0 / NULLIF({CUBE}.gold_earned, 0)"
        type: avg
        description: 經濟轉換成輸出的效率，看得出誰是把錢花在刀口上
        meta:
          group: 輸出
          decimals: 2
          higherIsBetter: true

      - name: avg_objective_damage
        title: 平均建築傷害
        sql: dmg_to_objectives
        type: avg
        meta:
          group: 輸出
          decimals: 0

      - name: avg_taken
        title: 平均承受傷害
        sql: dmg_taken
        type: avg
        meta:
          group: 生存
          decimals: 0

      - name: tank_share
        title: 承受佔比
        sql: >
          {CUBE}.dmg_taken * 100.0 / NULLIF(
            (SELECT SUM(t.dmg_taken) FROM match_participants t
             WHERE t.platform_id = {CUBE}.platform_id
               AND t.game_id = {CUBE}.game_id
               AND t.team_id = {CUBE}.team_id), 0)
        type: avg
        format: percent
        description: 承受傷害佔隊伍的比例，和傷害佔比對照可看出定位
        meta:
          group: 生存
          unit: "%"
          decimals: 1

      - name: avg_mitigated
        title: 平均減免傷害
        sql: dmg_mitigated
        type: avg
        meta:
          group: 生存
          decimals: 0

      - name: avg_heal
        title: 平均治療量
        sql: total_heal
        type: avg
        meta:
          group: 生存
          decimals: 0

      - name: avg_survival
        title: 平均最久存活
        sql: longest_time_living
        type: avg
        description: 單場中最長一次沒有死亡的時間（秒）
        meta:
          group: 生存
          unit: 秒
          decimals: 0

      - name: taken_physical_share
        title: 承受物理佔比
        sql: "{CUBE}.taken_physical * 100.0 / NULLIF({CUBE}.taken_physical + {CUBE}.taken_magic + {CUBE}.taken_true, 0)"
        type: avg
        format: percent
        description: 承受的傷害裡有多少是物理。偏高代表死在 AD 手上，可考慮補護甲
        meta:
          group: 生存
          unit: "%"
          decimals: 1

      - name: taken_magic_share
        title: 承受魔法佔比
        sql: "{CUBE}.taken_magic * 100.0 / NULLIF({CUBE}.taken_physical + {CUBE}.taken_magic + {CUBE}.taken_true, 0)"
        type: avg
        format: percent
        meta:
          group: 生存
          unit: "%"
          decimals: 1

      - name: champion_damage_focus
        title: 對英雄傷害佔比
        sql: "{CUBE}.dmg_to_champions * 100.0 / NULLIF({CUBE}.total_damage, 0)"
        type: avg
        format: percent
        description: 總輸出裡有多少打在英雄身上。偏低代表花很多時間在清兵
        meta:
          group: 輸出
          unit: "%"
          decimals: 1

      - name: avg_cc
        title: 平均控場時間
        sql: cc_duration
        type: avg
        meta:
          group: 戰鬥
          unit: 秒
          decimals: 0

      - name: avg_largest_spree
        title: 平均最高連殺
        sql: largest_spree
        type: avg
        meta:
          group: 戰鬥
          decimals: 1

      - name: avg_turret_kills
        title: 平均推塔數
        sql: turret_kills
        type: avg
        meta:
          group: 輸出
          decimals: 2

      - name: best_crit
        title: 最高單次暴擊
        sql: largest_crit
        type: max
        meta:
          group: 戰鬥
          decimals: 0

      - name: avg_units_healed
        title: 平均治療目標數
        sql: units_healed
        type: avg
        description: 治療影響到幾個單位，輔助型玩法會明顯偏高
        meta:
          group: 生存
          decimals: 1

      - name: avg_gold
        title: 平均經濟
        sql: gold_earned
        type: avg
        meta:
          group: 資源
          decimals: 0

      - name: gpm
        title: 每分鐘經濟
        sql: "{CUBE}.gold_earned * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta:
          group: 資源
          decimals: 0
          higherIsBetter: true

      - name: avg_cs
        title: 平均補兵
        sql: cs
        type: avg
        meta:
          group: 資源
          decimals: 1

      - name: unspent_gold
        title: 平均剩餘金錢
        sql: "{CUBE}.gold_earned - {CUBE}.gold_spent"
        type: avg
        description: 沒花掉的錢。偏高代表死亡時身上留太多，或回城買裝不夠積極
        meta:
          group: 資源
          decimals: 0
          higherIsBetter: false
