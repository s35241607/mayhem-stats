cubes:
  # 同場其他玩家的自我 join。Riot 的 API 不提供「誰跟誰一起排隊」的欄位,
  # 但同隊次數本身就能看出固定車隊。
  #
  # 每一列的語意是「某人的某一場 × 同場的另一個人」。查詢時務必用
  # subject_puuid 指定要以誰為視角,否則會把所有人的視角混在一起。
  - name: teammates
    sql: >
      SELECT me.platform_id, me.game_id, me.participant_id, me.win,
             me.champion_id AS subject_champion_id,
             me.puuid      AS subject_puuid,
             other.puuid   AS other_puuid,
             other.riot_id AS other_riot_id,
             mine_champ.name  AS subject_champion,
             mine_champ.icon_path AS subject_champion_icon,
             other_champ.name AS other_champion,
             other_champ.icon_path AS other_champion_icon,
             CASE WHEN other.team_id = me.team_id THEN 'teammate' ELSE 'opponent' END AS relation
      FROM match_participants me
      JOIN match_participants other
        ON other.platform_id = me.platform_id
       AND other.game_id     = me.game_id
       AND other.puuid      <> me.puuid
      LEFT JOIN dim_champions mine_champ  ON mine_champ.id  = me.champion_id
      LEFT JOIN dim_champions other_champ ON other_champ.id = other.champion_id

    # 與 participants.yml 相同的 refresh key,理由寫在那裡。SQL 必須一字不差才會被合併。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts)

    joins:
      - name: champion_roles
        sql: "{CUBE}.subject_champion_id = {champion_roles}.champion_id"
        relationship: one_to_many

      - name: matches
        sql: "{CUBE}.platform_id = {matches}.platform_id AND {CUBE}.game_id = {matches}.game_id"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id || ':' || {CUBE}.subject_puuid || ':' || {CUBE}.other_puuid"
        type: string
        primary_key: true

      - name: subject_puuid
        sql: subject_puuid
        type: string
        description: 以誰的視角看。不指定的話所有人的視角會混在一起。

      - name: player
        title: 同場玩家
        sql: other_riot_id
        type: string
        meta:
          group: 玩家

      - name: puuid
        sql: other_puuid
        type: string

      # 兩邊的英雄都放進來，才能問「和這個人一起時，我用哪隻比較會贏」。
      # 注意樣本：和最常同隊的人 95 場，卻攤在 57 個英雄上，多數只有 1 場。
      - name: my_champion
        title: 我的英雄
        sql: subject_champion
        type: string
        meta:
          group: 玩家

      - name: my_champion_icon
        sql: subject_champion_icon
        type: string

      - name: other_champion
        title: 對方的英雄
        sql: other_champion
        type: string
        meta:
          group: 玩家

      - name: other_champion_icon
        sql: other_champion_icon
        type: string

      - name: relation
        title: 隊友或對手
        sql: relation
        type: string
        meta:
          group: 玩家
        description: teammate = 與我同隊,opponent = 我的對手

    measures:
      - name: games
        title: 同場次數
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id"
        type: count_distinct
        description: 與這個人同場的對局數
        meta:
          group: 玩家
          decimals: 0

      - name: wins
        title: 同場勝場
        sql: "CASE WHEN {CUBE}.win = 1 THEN {CUBE}.platform_id || ':' || {CUBE}.game_id END"
        type: count_distinct
        description: 其中我方獲勝的場次
        meta:
          group: 玩家
          decimals: 0

      - name: winrate
        title: 同場勝率
        sql: "100.0 * {wins} / NULLIF({games}, 0)"
        type: number
        format: percent
        description: 和這個人同隊(或對上這個人)時,我的勝率
        meta:
          group: 玩家
          unit: "%"
          decimals: 1
