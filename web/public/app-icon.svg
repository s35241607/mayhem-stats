<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App 圖示（主畫面、分頁、PWA 安裝）。霓虹主題的底色與強調色；PNG 版由 web/scripts/build-icons.mjs 產生 -->
  <!-- 閃電直接放在底色上、佔畫面約 2/3：分頁上只有 16px，原本外面多一層淡色方塊時閃電只剩 7px 左右，看不出形狀。
       閃電仍在中間 80% 的安全區內，maskable 版被裁成圓形也不會切到 -->
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dedfb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b1220"/>
  <g transform="translate(88 88) scale(14)" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="1" stroke-linejoin="round">
    <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
  </g>
</svg>
